<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>THE FOREST</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    user-select:none; -webkit-user-select:none; }
  canvas { display:block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  #vignette { position:fixed; inset:0; pointer-events:none; z-index:3;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%); }

  .screen { position:fixed; inset:0; z-index:20; display:none; }
  .screen.show { display:flex; }

  #loading { z-index:40; background:#000; flex-direction:column;
    align-items:center; justify-content:center; }
  #loadTitle { color:#7a7a72; font-size:13px; letter-spacing:6px; margin-bottom:26px; }
  #loadBar { width:280px; height:3px; background:rgba(255,255,255,0.08); overflow:hidden; }
  #loadFill { height:100%; width:0%; background:#8a8a80; transition: width 0.2s linear; }
  #loadPct { color:#55554e; font-size:11px; letter-spacing:3px; margin-top:14px; }

  #disclaimer { z-index:25; background:#000; flex-direction:column;
    align-items:center; justify-content:center; }
  #disclaimer .warn { color:#9a2a22; font-size:16px; letter-spacing:4px;
    text-align:center; max-width:720px; padding:0 24px; line-height:2;
    text-shadow:0 0 12px rgba(160,20,10,0.35);
    opacity:0; animation: fadeIn 2.6s ease 0.5s forwards; }
  #disclaimer .warn.sub { color:#6a6a62; font-size:12px; letter-spacing:2px;
    text-shadow:none; animation-delay:3.4s; margin-top:18px; line-height:1.9; }
  @keyframes fadeIn { to { opacity:1; } }

  #contBtn {
    opacity:0; pointer-events:none;
    margin-top:34px;
    animation: fadeIn 2s ease 8s forwards;
  }
  #contBtn.ready { opacity:1; pointer-events:auto; animation:none; }

  /* Menu: transparent so 3D scene shows through */
  #menu { z-index:20; background:transparent; align-items:center; justify-content:flex-start;
    padding-left:9vw; pointer-events:none; }
  #menu .col { pointer-events:auto; }
  .col { display:none; flex-direction:column; gap:16px; z-index:21; position:relative; }
  .col.show { display:flex; }
  .col .btn { width:280px; }
  .settingLabel { font-size:12px; letter-spacing:3px; color:#888; margin-top:8px; }
  input[type=range] { width:280px; accent-color:#888; background:transparent; }

  .btn { position:relative; overflow:hidden; background:rgba(8,8,8,0.75);
    border:1px solid #3c3c3c; color:#aaa; font: inherit; font-size:16px;
    letter-spacing:4px; padding:18px 22px; cursor:pointer; text-align:center;
    min-width:160px; border-radius:0; }
  .btn:hover { border-color:#777; color:#ddd; }
  .btn:focus { outline:none; }
  .btn.on { border-color:#999; color:#fff; background:#1a1a1a; }
  .btn.low { color:#b08a6a; border-color:#5a4636; }
  .btn span { position:relative; z-index:1; }

  #actionButtons { position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    display:none; gap:10px; z-index:9; }
  #actionButtons.show { display:flex; }
  #staminaFill { position:absolute; left:0; bottom:0; height:4px; width:100%; background:#777; }

  #endScreen { position:fixed; inset:0; z-index:15; background:#000;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity 2.4s ease; }
  #endScreen.show { opacity:1; }
  #endText { color:#8a8a84; font-size:16px; letter-spacing:8px; }
</style>
</head>
<body>

<div id="vignette"></div>

<div id="loading" class="screen show">
  <div id="loadTitle">LOADING THE FOREST</div>
  <div id="loadBar"><div id="loadFill"></div></div>
  <div id="loadPct">0%</div>
</div>

<div id="disclaimer" class="screen">
  <p class="warn">WARNING! This game contains content that may cause severe distress.</p>
  <p class="warn sub">Something out there is hungry, and it does not like being looked at for too long.<br>Keep your light on. Keep moving. Do not turn away for long.</p>
  <button class="btn" id="contBtn" tabindex="-1">CONTINUE</button>
</div>

<div id="menu" class="screen">
  <div class="col show" id="mainCol">
    <button class="btn" id="btnPlay" tabindex="-1">PLAY</button>
    <button class="btn" id="btnSettings" tabindex="-1">SETTINGS</button>
    <button class="btn" id="btnExit" tabindex="-1">EXIT</button>
  </div>
  <div class="col" id="settingsCol">
    <div class="settingLabel">SENSITIVITY</div>
    <input type="range" id="sensRange" min="0.3" max="2.5" step="0.1" value="1" />
    <div class="settingLabel">VOLUME</div>
    <input type="range" id="volRange" min="0" max="1" step="0.05" value="0.9" />
    <button class="btn" id="btnBack" tabindex="-1">BACK</button>
  </div>
</div>

<div id="actionButtons">
  <button class="btn" id="btnLight" tabindex="-1"><span>LIGHT</span></button>
  <button class="btn" id="btnDetector" tabindex="-1"><span>DETECTOR</span></button>
  <button class="btn" id="btnReload" tabindex="-1"><span>RELOAD</span></button>
  <button class="btn" id="btnStamina" tabindex="-1"><div id="staminaFill"></div><span>STAMINA</span></button>
</div>

<div id="endScreen"><div id="endText"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   GAME STATE / CONSTANTS
   ========================================================= */

const NIGHT_SEC = 200;
const HOME_URL  = 'https://landenmartin-dev.github.io/boblox/';
const HEAD_LZ   = -1.38;
const game = { state: 'loading', t: 0 };

const sstep = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};
const nightProgress = () => Math.min(1, game.t / NIGHT_SEC);
const nightAggression = () => sstep(0.12, 0.9, nightProgress());

let px = 0, pz = 0;
let yaw = 0.35, pitch = -0.03;
let pointerDown = false, dragging = false, lastMouseX = 0, lastMouseY = 0;
let sprinting = false, stamina = 100, staminaRegenDelay = 0;
let sensitivity = 1.0;
let volumeLevel = 0.81;         // actual master gain multiplier
let bobPhase = 0;
let moving = false;

/* =========================================================
   RENDERER / SCENE / CAMERA
   ========================================================= */

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// Canvas stays in body (below overlays). Menu UI is transparent so scene shows through.
renderer.domElement.style.position = 'fixed';
renderer.domElement.style.top = '0';
renderer.domElement.style.left = '0';
document.body.insertBefore(renderer.domElement, document.getElementById('vignette'));

const scene = new THREE.Scene();
scene.background = null;
scene.fog = new THREE.FogExp2(0x000000, 0.058);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 300);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.68, 0);
scene.add(camera);

/* =========================================================
   SKY
   ========================================================= */

const skyGroup = new THREE.Group();
scene.add(skyGroup);

const skyMat = new THREE.ShaderMaterial({
  uniforms: { uDawn: { value: 0 }, uDusk: { value: 1 } },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform float uDawn;
    uniform float uDusk;
    varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      float h = max(d.y, 0.0);
      vec3 zen = vec3(0.004, 0.006, 0.012);
      vec3 hor = vec3(0.016, 0.020, 0.030);
      vec3 col = mix(hor, zen, pow(h, 0.45));
      float glow = exp(-h * 7.0);
      col += vec3(0.11, 0.055, 0.13) * glow * uDusk;
      col += vec3(0.62, 0.30, 0.12) * glow * uDawn;
      gl_FragColor = vec4(col, 1.0);
    }`,
  side: THREE.BackSide,
  depthWrite: false,
  depthTest: false
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(240, 32, 16), skyMat);
sky.renderOrder = -10;
sky.frustumCulled = false;
skyGroup.add(sky);

const STAR_N = 1400;
const starPos = new Float32Array(STAR_N * 3);
const starSize = new Float32Array(STAR_N);
const starPhase = new Float32Array(STAR_N);
for (let i = 0; i < STAR_N; i++) {
  const th = Math.random() * Math.PI * 2;
  const y = 0.02 + Math.pow(Math.random(), 0.6) * 0.98;
  const r = Math.sqrt(1 - y * y) * 235;
  starPos[i * 3]     = Math.cos(th) * r;
  starPos[i * 3 + 1] = y * 235;
  starPos[i * 3 + 2] = Math.sin(th) * r;
  starSize[i] = 1.0 + Math.random() * 2.2;
  starPhase[i] = Math.random();
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('aSize', new THREE.BufferAttribute(starSize, 1));
starGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhase, 1));
const starMat = new THREE.ShaderMaterial({
  uniforms: { uVis: { value: 0 }, uTime: { value: 0 } },
  vertexShader: `
    attribute float aSize;
    attribute float aPhase;
    uniform float uVis;
    uniform float uTime;
    varying float vA;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize;
      vA = uVis * (0.6 + 0.4 * sin(uTime * (0.7 + aPhase) + aPhase * 17.0));
    }`,
  fragmentShader: `
    varying float vA;
    void main() {
      vec2 p = gl_PointCoord - 0.5;
      float r = length(p);
      if (r > 0.5) discard;
      float a = smoothstep(0.5, 0.0, r);
      gl_FragColor = vec4(0.85, 0.9, 1.0, a * vA);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
const stars = new THREE.Points(starGeo, starMat);
stars.frustumCulled = false;
skyGroup.add(stars);

function makeRadialTex(stops) {
  const S = 128;
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  for (const [o, c] of stops) g.addColorStop(o, c);
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const moonMat = new THREE.SpriteMaterial({
  map: makeRadialTex([
    [0.0,  'rgba(245,240,222,1)'],
    [0.2,  'rgba(238,233,214,1)'],
    [0.27, 'rgba(200,205,222,0.35)'],
    [0.5,  'rgba(120,130,160,0.08)'],
    [1.0,  'rgba(0,0,0,0)']
  ]),
  transparent: true, depthWrite: false, fog: false, opacity: 0
});
const moon = new THREE.Sprite(moonMat);
moon.scale.set(12, 12, 1);
skyGroup.add(moon);

const sunMat = new THREE.SpriteMaterial({
  map: makeRadialTex([
    [0.0,  'rgba(255,242,205,1)'],
    [0.12, 'rgba(255,200,120,1)'],
    [0.3,  'rgba(255,140,60,0.45)'],
    [1.0,  'rgba(0,0,0,0)']
  ]),
  transparent: true, depthWrite: false, fog: false, opacity: 0,
  blending: THREE.AdditiveBlending
});
const sun = new THREE.Sprite(sunMat);
sun.scale.set(34, 34, 1);
skyGroup.add(sun);

const SUN_AZ  = Math.atan2(-Math.cos(0.35), -Math.sin(0.35));
const MOON_AZ = SUN_AZ + 2.4;
function dirFromAz(az, alt) {
  return new THREE.Vector3(Math.cos(alt) * Math.cos(az), Math.sin(alt), Math.cos(alt) * Math.sin(az));
}
const sunDirVec = dirFromAz(SUN_AZ, 0.1);

/* =========================================================
   LIGHTS
   ========================================================= */

const ambientLight = new THREE.AmbientLight(0x1a2430, 0.14);
scene.add(ambientLight);
const moonLight = new THREE.DirectionalLight(0x3a4a6a, 0.08);
moonLight.position.set(-1, 3, 1.5);
scene.add(moonLight);
const sunLight = new THREE.DirectionalLight(0xffb070, 0);
scene.add(sunLight);
scene.add(sunLight.target);

const flashlight = new THREE.SpotLight(0xffe9c6, 620, 130, Math.PI * 0.19, 0.45, 1.4);
flashlight.castShadow = true;
flashlight.shadow.mapSize.set(512, 512);
flashlight.shadow.camera.near = 0.3;
flashlight.shadow.camera.far = 90;
flashlight.shadow.bias = -0.0015;
flashlight.shadow.normalBias = 0.045;
flashlight.position.set(0.26, -0.16, 0.10);
camera.add(flashlight);

const flashTarget = new THREE.Object3D();
flashTarget.position.set(0, -0.30, -8);
camera.add(flashTarget);
flashlight.target = flashTarget;
const FLASH_BASE = flashlight.intensity;
let flashlightOn = true;
let flickerT = 0;

/* =========================================================
   PROCEDURAL TEXTURES
   ========================================================= */

function makeGroundTexture() {
  const S = 512;
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#14100a'; ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 12000; i++) {
    const x = Math.random()*S, y = Math.random()*S, v = Math.random();
    if (v < 0.55) ctx.fillStyle = `rgba(${26+Math.random()*26|0},${22+Math.random()*22|0},${14+Math.random()*14|0},0.75)`;
    else if (v < 0.86) ctx.fillStyle = `rgba(${24+Math.random()*20|0},${36+Math.random()*26|0},${16+Math.random()*12|0},0.55)`;
    else ctx.fillStyle = `rgba(${64+Math.random()*40|0},${50+Math.random()*32|0},${24+Math.random()*18|0},0.45)`;
    ctx.fillRect(x, y, 1+Math.random()*2.2, 1+Math.random()*2.2);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeBarkTexture() {
  const W = 256, H = 512;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#3a2e22'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const x = Math.random()*W, w = 8+Math.random()*46;
    const g = ctx.createLinearGradient(x,0,x+w,0);
    const dark = Math.random() < 0.5;
    const a = 0.06+Math.random()*0.14;
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(0.5, dark ? `rgba(12,9,6,${a})` : `rgba(${120+Math.random()*40|0},${100+Math.random()*30|0},${76+Math.random()*24|0},${a*0.8})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x,0,w,H);
  }
  for (let i = 0; i < 1600; i++) {
    const x = Math.random()*W, y = Math.random()*H, len = 12+Math.random()*150, w = 0.5+Math.random()*2.6, t = Math.random();
    if (t < 0.48) ctx.fillStyle = `rgba(${14+Math.random()*18|0},${11+Math.random()*14|0},${8+Math.random()*10|0},${0.22+Math.random()*0.42})`;
    else if (t < 0.82) ctx.fillStyle = `rgba(${62+Math.random()*38|0},${50+Math.random()*30|0},${36+Math.random()*22|0},${0.16+Math.random()*0.32})`;
    else ctx.fillStyle = `rgba(${118+Math.random()*46|0},${102+Math.random()*38|0},${80+Math.random()*28|0},${0.08+Math.random()*0.20})`;
    ctx.fillRect(x, y, w, len);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 4);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeCanopyTexture() {
  const S = 512;
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, S, S);
  function drawLeaf(x, y, len, wid, rot, hue, sat, lig) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    const w = wid, h = len;
    const path = new Path2D();
    path.moveTo(0, -h * 0.50);
    path.bezierCurveTo(w * 1.05, -h * 0.28, w * 1.00, h * 0.22, w * 0.16, h * 0.47);
    path.quadraticCurveTo(w * 0.06, h * 0.50, 0, h * 0.50);
    path.quadraticCurveTo(-w * 0.06, h * 0.50, -w * 0.16, h * 0.47);
    path.bezierCurveTo(-w * 1.00, h * 0.22, -w * 1.05, -h * 0.28, 0, -h * 0.50);
    path.closePath();
    const g = ctx.createLinearGradient(-w * 0.6, 0, w * 0.6, 0);
    g.addColorStop(0,   `hsl(${hue},${sat}%,${lig - 7}%)`);
    g.addColorStop(0.5, `hsl(${hue},${sat}%,${lig + 9}%)`);
    g.addColorStop(1,   `hsl(${hue},${sat}%,${lig - 4}%)`);
    ctx.fillStyle = g; ctx.fill(path);
    ctx.strokeStyle = `hsla(${hue},${sat}%,${lig - 22}%,0.45)`;
    ctx.lineWidth = Math.max(0.6, len * 0.010); ctx.stroke(path);
    ctx.restore();
  }
  for (let i = 0; i < 90; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.pow(Math.random(), 0.55) * 0.45 * S;
    const x = S * 0.5 + Math.cos(a) * r;
    const y = S * 0.5 + Math.sin(a) * r;
    const len = S * (0.14 + Math.random() * 0.09);
    const wid = len * (0.15 + Math.random() * 0.07);
    drawLeaf(x, y, len, wid, Math.random()*Math.PI*2,
      62 + Math.random() * 58, 28 + Math.random() * 38, 18 + Math.random() * 26);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeLeafTexture() {
  const S = 128;
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, S, S);
  ctx.save(); ctx.translate(S / 2, S / 2);
  const w = S * 0.30, h = S * 0.44;
  const path = new Path2D();
  path.moveTo(0, -h);
  path.bezierCurveTo(w * 0.85, -h * 0.62, w * 0.95, h * 0.30, 0, h);
  path.bezierCurveTo(-w * 0.95, h * 0.30, -w * 0.85, -h * 0.62, 0, -h);
  ctx.fillStyle = '#d9dcc6'; ctx.fill(path);
  ctx.restore();
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeGrassTexture() {
  const S = 128;
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, S, S);
  for (let i = 0; i < 13; i++) {
    const baseX = S * (0.10 + 0.80 * (i + 0.5) / 13) + (Math.random() - 0.5) * 10;
    const h = S * (0.50 + Math.random() * 0.45);
    const w = 3 + Math.random() * 3.5;
    const lean = (Math.random() - 0.5) * S * 0.40;
    const tipX = baseX + lean, tipY = S - h;
    const g = ctx.createLinearGradient(0, S, 0, tipY);
    g.addColorStop(0,   `rgba(${28+Math.random()*20|0},${48+Math.random()*22|0},${15+Math.random()*12|0},1)`);
    g.addColorStop(0.6, `rgba(${56+Math.random()*24|0},${98+Math.random()*30|0},${27+Math.random()*18|0},1)`);
    g.addColorStop(1,   `rgba(${90+Math.random()*30|0},${140+Math.random()*34|0},${46+Math.random()*22|0},1)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(baseX - w, S);
    ctx.quadraticCurveTo(baseX - w * 0.3 + lean * 0.5, S - h * 0.5, tipX, tipY);
    ctx.quadraticCurveTo(baseX + w * 0.3 + lean * 0.5, S - h * 0.5, baseX + w, S);
    ctx.closePath(); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeRockTexture() {
  const S = 128;
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#3a3a38'; ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 2500; i++) {
    const x = Math.random()*S, y = Math.random()*S;
    const n = Math.random();
    if (n < 0.5) ctx.fillStyle = `rgba(${20+Math.random()*15|0},${20+Math.random()*15|0},${20+Math.random()*15|0},0.5)`;
    else if (n < 0.85) ctx.fillStyle = `rgba(${70+Math.random()*30|0},${68+Math.random()*30|0},${65+Math.random()*30|0},0.4)`;
    else ctx.fillStyle = `rgba(${100+Math.random()*40|0},${110+Math.random()*30|0},${80+Math.random()*30|0},0.3)`;
    ctx.fillRect(x, y, 1+Math.random()*2, 1+Math.random()*2);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeCowHideTexture() {
  const W = 256, H = 256;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0d0a07'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 4500; i++) {
    const x = Math.random()*W, y = Math.random()*H;
    const r = 1 + Math.random() * 3;
    const n = Math.random();
    if (n < 0.4) ctx.fillStyle = `rgba(${20+Math.random()*15|0},${15+Math.random()*12|0},${10+Math.random()*8|0},0.5)`;
    else if (n < 0.8) ctx.fillStyle = `rgba(${10+Math.random()*8|0},${8+Math.random()*6|0},${5+Math.random()*4|0},0.6)`;
    else ctx.fillStyle = `rgba(${45+Math.random()*20|0},${32+Math.random()*15|0},${20+Math.random()*12|0},0.3)`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  for (let i = 0; i < 16; i++) {
    const x = Math.random()*W, y = Math.random()*H;
    const r = 8 + Math.random() * 22;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(90,75,60,0.55)');
    g.addColorStop(0.5, 'rgba(60,48,38,0.35)');
    g.addColorStop(1, 'rgba(20,15,10,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  for (let i = 0; i < 7; i++) {
    const y = 60 + i * 22;
    const g = ctx.createLinearGradient(0, y - 4, 0, y + 8);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.5, 'rgba(0,0,0,0.45)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(40, y - 4, W - 80, 12);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* =========================================================
   NOISE / RANDOM
   ========================================================= */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
function valueNoise(x, z, scale) {
  const ix = Math.floor(x / scale), iz = Math.floor(z / scale);
  const fx = (x / scale) - ix, fz = (z / scale) - iz;
  const h00 = hash2(ix, iz)     / 4294967296;
  const h10 = hash2(ix+1, iz)   / 4294967296;
  const h01 = hash2(ix, iz+1)   / 4294967296;
  const h11 = hash2(ix+1, iz+1) / 4294967296;
  const sx = fx*fx*(3-2*fx), sz = fz*fz*(3-2*fz);
  const a = h00*(1-sx) + h10*sx;
  const b = h01*(1-sx) + h11*sx;
  return a*(1-sz) + b*sz;
}

/* =========================================================
   INSTANCE BATCH
   ========================================================= */

class InstBatch {
  constructor(cap = 256) {
    this.m = new Float32Array(cap * 16);
    this.c = new Float32Array(cap * 3);
    this.n = 0;
  }
  push(mat, r, g, b) {
    if ((this.n + 1) * 16 > this.m.length) {
      const nm = new Float32Array(this.m.length * 2); nm.set(this.m); this.m = nm;
      const nc = new Float32Array(this.c.length * 2); nc.set(this.c); this.c = nc;
    }
    mat.toArray(this.m, this.n * 16);
    this.c[this.n*3]     = r;
    this.c[this.n*3 + 1] = g;
    this.c[this.n*3 + 2] = b;
    this.n++;
  }
  build(geo, mat) {
    if (this.n === 0) return null;
    const mesh = new THREE.InstancedMesh(geo, mat, this.n);
    mesh.instanceMatrix.array.set(this.m.subarray(0, this.n * 16));
    mesh.instanceMatrix.needsUpdate = true;
    mesh.instanceColor = new THREE.InstancedBufferAttribute(
      new Float32Array(this.c.subarray(0, this.n * 3)), 3
    );
    return mesh;
  }
}

/* =========================================================
   CHUNKED FOREST
   ========================================================= */

const CHUNK = 20;
const VIEW = 2;
const CHUNK_KEEP = VIEW + 1;
const chunks = new Map();

const _m = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _e = new THREE.Euler();
const _v = new THREE.Vector3();
const _s = new THREE.Vector3();
const _c = new THREE.Color();
const _up = new THREE.Vector3(0, 1, 0);
const _dir = new THREE.Vector3();
const _sph = new THREE.Sphere(new THREE.Vector3(), 32);

function buildChunk(cx, cz) {
  const key = cx + ',' + cz;
  if (chunks.has(key)) return;
  const rng = mulberry32(hash2(cx, cz));
  const ox = cx * CHUNK, oz = cz * CHUNK;

  const wood     = new InstBatch(640);
  const deadWood = new InstBatch(160);
  const leaf     = new InstBatch(2048);
  const grass    = new InstBatch(2048);
  const rocks    = new InstBatch(64);
  const stones   = new InstBatch(32);
  const logs     = new InstBatch(32);

  const trees = [];
  const spots = [];

  const treeCount = 22 + Math.floor(rng() * 8);

  for (let i = 0; i < treeCount; i++) {
    const x = ox + rng() * CHUNK;
    const z = oz + rng() * CHUNK;
    if (Math.abs(x) < 3.5 && Math.abs(z) < 3.5) continue;
    if (valueNoise(x, z, 26) < 0.36) continue;

    const h = 6.5 + rng() * 9.5;
    const rad = 0.14 + rng() * 0.13;

    _e.set((rng() - 0.5) * 0.09, rng() * Math.PI * 2, (rng() - 0.5) * 0.09, 'YXZ');
    _q.setFromEuler(_e);
    _m.compose(_v.set(x, 0, z), _q, _s.set(rad, h, rad));
    const tw = 0.80 + rng() * 0.32;
    wood.push(_m, tw, tw * 0.97, tw * 0.93);
    trees.push({ x, z, r: rad * 2.0 });

    const branchCount = 3 + Math.floor(rng() * 4);
    for (let b = 0; b < branchCount; b++) {
      const startY = h * (0.40 + rng() * 0.40);
      const ang = rng() * Math.PI * 2;
      const len = h * (0.16 + rng() * 0.18);
      const rise = h * (0.05 + rng() * 0.14);
      const endX = x + Math.cos(ang) * len;
      const endY = startY + rise;
      const endZ = z + Math.sin(ang) * len;
      const br = 0.030 + rng() * 0.024;
      _dir.set(endX - x, endY - startY, endZ - z);
      const blen = _dir.length();
      if (blen > 0.1) {
        _dir.normalize();
        _q.setFromUnitVectors(_up, _dir);
        _m.compose(_v.set(x, startY, z), _q, _s.set(br, blen, br));
        wood.push(_m, tw, tw * 0.97, tw * 0.93);
      }
      if (rng() < 0.75) {
        spots.push({ x: endX + (rng()-0.5)*0.7, y: endY + (rng()-0.5)*0.5,
                     z: endZ + (rng()-0.5)*0.7, s: h * (0.17 + rng()*0.10) });
      }
    }

    const crownCY = h * 0.82;
    const crownR  = h * (0.28 + rng() * 0.10);
    const crownRY = h * (0.22 + rng() * 0.09);
    const crownClusters = 16 + Math.floor(rng() * 9);
    for (let c = 0; c < crownClusters; c++) {
      const theta = rng() * Math.PI * 2;
      const phi = Math.acos(2 * rng() - 1);
      const rr = 0.45 + Math.pow(rng(), 0.7) * 0.55;
      spots.push({
        x: x + Math.sin(phi) * Math.cos(theta) * crownR * rr,
        y: crownCY + Math.cos(phi) * crownRY * rr,
        z: z + Math.sin(phi) * Math.sin(theta) * crownR * rr,
        s: h * (0.21 + rng() * 0.12)
      });
    }
  }

  for (let i = 0; i < spots.length; i++) {
    const sp = spots[i];
    const baseRot = rng() * Math.PI * 2;
    for (let q = 0; q < 2; q++) {
      const rotY = baseRot + q * (Math.PI / 2) + (rng() - 0.5) * 0.35;
      _e.set((rng() - 0.5) * 0.55, rotY, (rng() - 0.5) * 0.55, 'YXZ');
      _q.setFromEuler(_e);
      const s = sp.s * (0.85 + rng() * 0.35);
      _m.compose(_v.set(sp.x, sp.y, sp.z), _q, _s.set(s, s, s));
      _c.setHSL(0.20 + rng() * 0.10, 0.16 + rng() * 0.30, 0.62 + rng() * 0.38);
      leaf.push(_m, _c.r, _c.g, _c.b);
    }
  }

  const deadCount = 1 + Math.floor(rng() * 2);
  for (let i = 0; i < deadCount; i++) {
    const x = ox + rng() * CHUNK;
    const z = oz + rng() * CHUNK;
    if (Math.abs(x) < 3.5 && Math.abs(z) < 3.5) continue;
    const h = 5 + rng() * 4;
    const rad = 0.13 + rng() * 0.08;
    _e.set((rng() - 0.5) * 0.15, rng() * Math.PI * 2, (rng() - 0.5) * 0.15, 'YXZ');
    _q.setFromEuler(_e);
    _m.compose(_v.set(x, 0, z), _q, _s.set(rad, h, rad));
    const tw = 0.55 + rng() * 0.15;
    deadWood.push(_m, tw, tw * 0.95, tw * 0.85);
    trees.push({ x, z, r: rad * 2.0 });
    const bcount = 2 + Math.floor(rng() * 3);
    for (let b = 0; b < bcount; b++) {
      const startY = h * (0.55 + rng() * 0.35);
      const ang = rng() * Math.PI * 2;
      const len = h * (0.15 + rng() * 0.18);
      const endX = x + Math.cos(ang) * len;
      const endY = startY + len * (0.4 + rng() * 0.5);
      const endZ = z + Math.sin(ang) * len;
      const br = 0.025 + rng() * 0.02;
      _dir.set(endX - x, endY - startY, endZ - z);
      const blen = _dir.length();
      if (blen > 0.1) {
        _dir.normalize();
        _q.setFromUnitVectors(_up, _dir);
        _m.compose(_v.set(x, startY, z), _q, _s.set(br, blen, br));
        deadWood.push(_m, tw, tw * 0.95, tw * 0.85);
      }
    }
  }

  const rockCount = 2 + Math.floor(rng() * 3);
  for (let i = 0; i < rockCount; i++) {
    const x = ox + rng() * CHUNK;
    const z = oz + rng() * CHUNK;
    if (Math.abs(x) < 3.5 && Math.abs(z) < 3.5) continue;
    const scale = 0.35 + rng() * 0.85;
    _e.set(rng() * Math.PI, rng() * Math.PI, rng() * Math.PI, 'XYZ');
    _q.setFromEuler(_e);
    _m.compose(_v.set(x, scale * 0.4, z), _q,
      _s.set(scale * (0.85 + rng() * 0.4), scale * (0.55 + rng() * 0.3), scale * (0.85 + rng() * 0.4)));
    const t = 0.65 + rng() * 0.55;
    rocks.push(_m, t, t * 0.98, t * 0.94);
  }

  if (rng() < 0.6) {
    const x = ox + rng() * CHUNK;
    const z = oz + rng() * CHUNK;
    if (Math.abs(x) > 3.5 || Math.abs(z) > 3.5) {
      const len = 2.5 + rng() * 3.0;
      const rad = 0.14 + rng() * 0.10;
      const ang = rng() * Math.PI * 2;
      _e.set(0, ang, Math.PI / 2, 'YXZ');
      _q.setFromEuler(_e);
      _m.compose(_v.set(x, rad, z), _q, _s.set(rad, len, rad));
      const t = 0.6 + rng() * 0.3;
      logs.push(_m, t, t * 0.95, t * 0.85);
    }
  }

  if (rng() < 0.30) {
    const cx2 = ox + 4 + rng() * (CHUNK - 8);
    const cz2 = oz + 4 + rng() * (CHUNK - 8);
    const sc = 1 + Math.floor(rng() * 3);
    for (let i = 0; i < sc; i++) {
      const x = cx2 + (rng() - 0.5) * 2.5;
      const z = cz2 + (rng() - 0.5) * 2.5;
      const w = 0.35 + rng() * 0.30;
      const h = 1.4 + rng() * 2.2;
      const d = 0.28 + rng() * 0.20;
      _e.set((rng() - 0.5) * 0.22, rng() * Math.PI * 2, (rng() - 0.5) * 0.22, 'YXZ');
      _q.setFromEuler(_e);
      _m.compose(_v.set(x, h * 0.5, z), _q, _s.set(w, h, d));
      const t = 0.48 + rng() * 0.35;
      stones.push(_m, t, t * 0.98, t * 0.95);
    }
  }

  const clearing = valueNoise(ox + CHUNK * 0.5, oz + CHUNK * 0.5, 26) < 0.36;
  const tuftCount = (clearing ? 520 : 400) + Math.floor(rng() * 200);
  for (let i = 0; i < tuftCount; i++) {
    const gx = ox + rng() * CHUNK;
    const gz = oz + rng() * CHUNK;
    const gw = 0.45 + rng() * 0.55;
    const gh = 0.38 + rng() * 0.72;
    const baseRot = rng() * Math.PI * 2;
    _c.setHSL(0.16 + rng() * 0.12, 0.35 + rng() * 0.25, 0.14 + rng() * 0.16);
    for (let c = 0; c < 2; c++) {
      _e.set(0, baseRot + c * (Math.PI * 0.5) + (rng() - 0.5) * 0.6, 0, 'XYZ');
      _q.setFromEuler(_e);
      _m.compose(_v.set(gx, 0, gz), _q, _s.set(gw, gh, 1));
      grass.push(_m, _c.r, _c.g, _c.b);
    }
  }

  const group = new THREE.Group();
  const addMesh = (mesh, castShadow) => {
    if (!mesh) return;
    mesh.castShadow = castShadow;
    mesh.receiveShadow = true;
    mesh.boundingSphere = _sph.clone().set(_v.set(ox + CHUNK*0.5, 8, oz + CHUNK*0.5), 32);
    group.add(mesh);
  };
  addMesh(wood.build(trunkGeo, trunkMat), true);
  addMesh(deadWood.build(trunkGeo, deadTrunkMat), true);
  addMesh(leaf.build(canopyCardGeo, canopyMat), false);
  addMesh(grass.build(grassCardGeo, grassMat), false);
  addMesh(rocks.build(rockGeo, rockMat), true);
  addMesh(stones.build(stoneGeo, stoneMat), true);
  addMesh(logs.build(trunkGeo, logMat), true);

  scene.add(group);
  chunks.set(key, { cx, cz, group, trees });
}

function updateChunks() {
  const pcx = Math.floor(px / CHUNK), pcz = Math.floor(pz / CHUNK);
  let built = 0;
  for (let r = 0; r <= VIEW && built < 2; r++) {
    for (let dx = -r; dx <= r && built < 2; dx++) {
      for (let dz = -r; dz <= r && built < 2; dz++) {
        if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
        const cx = pcx + dx, cz = pcz + dz;
        if (!chunks.has(cx + ',' + cz)) { buildChunk(cx, cz); built++; }
      }
    }
  }
  for (const [key, c] of chunks) {
    if (Math.abs(c.cx - pcx) > CHUNK_KEEP || Math.abs(c.cz - pcz) > CHUNK_KEEP) {
      scene.remove(c.group);
      chunks.delete(key);
    }
  }
}

function resolveTrees() {
  const pcx = Math.floor(px / CHUNK), pcz = Math.floor(pz / CHUNK);
  for (let dx = -1; dx <= 1; dx++) {
    for (let dz = -1; dz <= 1; dz++) {
      const ch = chunks.get((pcx + dx) + ',' + (pcz + dz));
      if (!ch) continue;
      for (const tr of ch.trees) {
        const ddx = px - tr.x, ddz = pz - tr.z;
        const minD = tr.r + 0.35;
        const d2 = ddx * ddx + ddz * ddz;
        if (d2 < minD * minD && d2 > 1e-6) {
          const d = Math.sqrt(d2);
          px = tr.x + ddx / d * minD;
          pz = tr.z + ddz / d * minD;
        }
      }
    }
  }
}

/* =========================================================
   POINT-PARTICLE SHADER
   ========================================================= */

const POINT_VS = /* glsl */`
  attribute float aSize;
  attribute float aAlpha;
  attribute vec3  aColor;
  uniform float uScale;
  uniform float uBeam;
  uniform float uLightScale;
  varying float vAlpha;
  varying vec3  vColor;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mv;
    float dist = max(-mv.z, 0.05);
    gl_PointSize = clamp(aSize * uScale / dist, 1.0, 48.0);
    vec3 dir = normalize(mv.xyz);
    float beam = smoothstep(0.78, 0.995, dot(dir, vec3(0.0, 0.0, -1.0)));
    beam *= 1.0 - smoothstep(6.0, 40.0, dist);
    beam = 0.08 + beam * 0.92;
    float fade = 1.0 - smoothstep(24.0, 58.0, dist);
    vAlpha = aAlpha * mix(1.0, beam, uBeam) * fade * uLightScale;
    vColor = aColor;
  }
`;
const POINT_FS = /* glsl */`
  varying float vAlpha;
  varying vec3  vColor;
  void main() {
    vec2 p = gl_PointCoord - 0.5;
    float r2 = dot(p, p);
    if (r2 > 0.25) discard;
    float a = 1.0 - r2 * 4.0;
    a *= a; a *= vAlpha;
    if (a < 0.004) discard;
    gl_FragColor = vec4(vColor, a);
  }
`;
const pointMats = [];
let pointScale = 1;
function makePointMaterial(beam) {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uScale: { value: pointScale },
      uBeam:  { value: beam },
      uLightScale: { value: 1.0 }
    },
    vertexShader: POINT_VS, fragmentShader: POINT_FS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  pointMats.push(mat);
  return mat;
}
function updatePointScale() {
  const h = renderer.domElement.height;
  pointScale = h / (2 * Math.tan(camera.fov * Math.PI / 360));
  for (let i = 0; i < pointMats.length; i++) pointMats[i].uniforms.uScale.value = pointScale;
}

const MOTE_COUNT = 180;
const moteGeo = new THREE.BufferGeometry();
const motePos   = new Float32Array(MOTE_COUNT * 3);
const moteSize  = new Float32Array(MOTE_COUNT);
const moteAlpha = new Float32Array(MOTE_COUNT);
const moteCol   = new Float32Array(MOTE_COUNT * 3);
const moteData  = [];
for (let i = 0; i < MOTE_COUNT; i++) {
  motePos[i*3]     = (Math.random() - 0.5) * 40;
  motePos[i*3+1]   = Math.random() * 9;
  motePos[i*3+2]   = (Math.random() - 0.5) * 40;
  const warm = 0.85 + Math.random() * 0.15;
  moteCol[i*3]     = warm;
  moteCol[i*3+1]   = warm * (0.92 + Math.random() * 0.06);
  moteCol[i*3+2]   = warm * (0.74 + Math.random() * 0.12);
  moteSize[i]  = 0.022 + Math.random() * 0.048;
  moteAlpha[i] = 0.0;
  moteData.push({
    baseAlpha: 0.18 + Math.random() * 0.35,
    phase: Math.random() * Math.PI * 2,
    speed: 0.03 + Math.random() * 0.09,
    drift: 0.10 + Math.random() * 0.22,
    twinkle: 0.6 + Math.random() * 2.2
  });
}
moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
moteGeo.setAttribute('aSize',    new THREE.BufferAttribute(moteSize, 1));
moteGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(moteAlpha, 1));
moteGeo.setAttribute('aColor',   new THREE.BufferAttribute(moteCol, 3));
const motesMat = makePointMaterial(1.0);
const motes = new THREE.Points(moteGeo, motesMat);
motes.frustumCulled = false;
scene.add(motes);

function updateMotes(dt, t) {
  const pos = moteGeo.attributes.position.array;
  const alp = moteGeo.attributes.aAlpha.array;
  for (let i = 0; i < MOTE_COUNT; i++) {
    const d = moteData[i];
    pos[i*3+1] += d.speed * dt;
    pos[i*3]   += Math.sin(t * 0.32 + d.phase) * d.drift * dt;
    pos[i*3+2] += Math.cos(t * 0.26 + d.phase * 1.3) * d.drift * dt;
    let x = pos[i*3], y = pos[i*3+1], z = pos[i*3+2];
    if (y > 9) y -= 9;
    if (x > 20) x -= 40; else if (x < -20) x += 40;
    if (z > 20) z -= 40; else if (z < -20) z += 40;
    pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
    const s = Math.sin(t * d.twinkle + d.phase);
    alp[i] = d.baseAlpha * (0.45 + 0.55 * s * s);
  }
  moteGeo.attributes.position.needsUpdate = true;
  moteGeo.attributes.aAlpha.needsUpdate = true;
}

const POCKET_COUNT = 5, PER_POCKET = 8;
const FIREFLY_COUNT = POCKET_COUNT * PER_POCKET;
function makePocket(cx, cz) {
  let x = 0, z = 0;
  for (let t = 0; t < 8; t++) {
    x = cx + (Math.random() - 0.5) * 50;
    z = cz + (Math.random() - 0.5) * 50;
    if (valueNoise(x, z, 26) < 0.38) break;
  }
  return { x, z, y: 0.4 + Math.random() * 2.4 };
}
const fireflyPockets = [];
for (let i = 0; i < POCKET_COUNT; i++) fireflyPockets.push(makePocket(0, 0));

const fireflyGeo = new THREE.BufferGeometry();
const fireflyPos   = new Float32Array(FIREFLY_COUNT * 3);
const fireflyCol   = new Float32Array(FIREFLY_COUNT * 3);
const fireflySize  = new Float32Array(FIREFLY_COUNT);
const fireflyAlpha = new Float32Array(FIREFLY_COUNT);
const fireflyData  = [];
for (let i = 0; i < FIREFLY_COUNT; i++) {
  fireflyData.push({
    pocket: i % POCKET_COUNT,
    phase: Math.random() * Math.PI * 2,
    freq: 0.35 + Math.random() * 0.7,
    orbitR: 0.5 + Math.random() * 1.9,
    orbitSpeed: (0.12 + Math.random() * 0.30) * (Math.random() < 0.5 ? -1 : 1),
    bobAmp: 0.15 + Math.random() * 0.45,
    bobSpeed: 0.3 + Math.random() * 0.5,
    orbAspect: 0.7 + Math.random() * 0.6
  });
}
fireflyGeo.setAttribute('position', new THREE.BufferAttribute(fireflyPos, 3));
fireflyGeo.setAttribute('aColor',   new THREE.BufferAttribute(fireflyCol, 3));
fireflyGeo.setAttribute('aSize',    new THREE.BufferAttribute(fireflySize, 1));
fireflyGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(fireflyAlpha, 1));
const fireflies = new THREE.Points(fireflyGeo, makePointMaterial(0.0));
fireflies.frustumCulled = false;
scene.add(fireflies);

function updateFireflies(dt, t) {
  const pos = fireflyGeo.attributes.position.array;
  const col = fireflyGeo.attributes.aColor.array;
  const siz = fireflyGeo.attributes.aSize.array;
  const alp = fireflyGeo.attributes.aAlpha.array;
  for (let i = 0; i < FIREFLY_COUNT; i++) {
    const d = fireflyData[i];
    const p = fireflyPockets[d.pocket];
    const a = t * d.orbitSpeed + d.phase;
    const x = p.x + Math.cos(a) * d.orbitR;
    const z = p.z + Math.sin(a) * d.orbitR * d.orbAspect;
    const y = p.y + Math.sin(t * d.bobSpeed + d.phase) * d.bobAmp
            + Math.sin(t * d.orbitSpeed * 2.1 + d.phase) * 0.08;
    pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
    const pulse = 0.12 + 0.88 * Math.max(0, Math.sin(t * d.freq + d.phase));
    col[i*3]   = 0.78 * (0.55 + 0.45 * pulse);
    col[i*3+1] = 1.00 * (0.70 + 0.30 * pulse);
    col[i*3+2] = 0.42 * (0.35 + 0.65 * pulse);
    siz[i] = 0.055 + 0.055 * pulse;
    alp[i] = 0.45 + 0.55 * pulse;
  }
  fireflyGeo.attributes.position.needsUpdate = true;
  fireflyGeo.attributes.aColor.needsUpdate = true;
  fireflyGeo.attributes.aSize.needsUpdate = true;
  fireflyGeo.attributes.aAlpha.needsUpdate = true;
}

const GROUND_LEAF_MAX = 200;

const groundLeafInst = new THREE.InstancedMesh(leafQuadGeo, leafMat, GROUND_LEAF_MAX);
groundLeafInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
groundLeafInst.frustumCulled = false;
groundLeafInst.receiveShadow = true;
scene.add(groundLeafInst);
{
  const hide = new THREE.Matrix4().makeTranslation(0, -1000, 0);
  for (let i = 0; i < GROUND_LEAF_MAX; i++) groundLeafInst.setMatrixAt(i, hide);
  groundLeafInst.instanceMatrix.needsUpdate = true;
}
let groundCursor = 0;

const leafData = [];
const windX = 0.16, windZ = -0.09;
for (let i = 0; i < LEAF_N; i++) {
  leafData.push({
    x: (Math.random() - 0.5) * 32, y: 1 + Math.random() * 15, z: (Math.random() - 0.5) * 32,
    rx: Math.random() * 6.283, ry: Math.random() * 6.283, rz: Math.random() * 6.283,
    vrx: (Math.random() - 0.5) * 2.2, vry: (Math.random() - 0.5) * 1.6, vrz: (Math.random() - 0.5) * 2.2,
    speed: 0.42 + Math.random() * 0.55,
    swayAmp: 0.22 + Math.random() * 0.5, swayFreq: 0.8 + Math.random() * 1.4,
    phase: Math.random() * 6.283, scale: 0.8 + Math.random() * 0.55
  });
}
function respawnLeaf(d) {
  d.x = (Math.random() - 0.5) * 30;
  d.z = (Math.random() - 0.5) * 30;
  d.y = 9 + Math.random() * 7;
  d.rx = Math.random() * 6.283; d.ry = Math.random() * 6.283; d.rz = Math.random() * 6.283;
  d.speed = 0.42 + Math.random() * 0.55;
  d.swayAmp = 0.22 + Math.random() * 0.5;
  d.swayFreq = 0.8 + Math.random() * 1.4;
  d.scale = 0.8 + Math.random() * 0.55;
}
function updateLeaves(dt, t) {
  for (let i = 0; i < LEAF_N; i++) {
    const d = leafData[i];
    const sway = Math.sin(t * d.swayFreq + d.phase);
    d.x += (sway * d.swayAmp + windX) * dt;
    d.z += (Math.cos(t * d.swayFreq * 0.73 + d.phase * 1.7) * d.swayAmp * 0.8 + windZ) * dt;
    d.y -= d.speed * dt * (0.62 + 0.55 * Math.abs(sway));
    d.rx += d.vrx * dt; d.ry += d.vry * dt; d.rz += d.vrz * dt;
    if (d.y <= 0.05) {
      const slot = groundCursor;
      groundCursor = (groundCursor + 1) % GROUND_LEAF_MAX;
      _e.set(-Math.PI / 2 + (Math.random() - 0.5) * 0.24,
             Math.random() * Math.PI * 2,
             (Math.random() - 0.5) * 0.24, 'XYZ');
      _q.setFromEuler(_e);
      const sc = d.scale * (0.9 + Math.random() * 0.3);
      _m.compose(_v.set(px + d.x, 0.02 + Math.random() * 0.02, pz + d.z), _q, _s.set(sc, sc, sc));
      groundLeafInst.setMatrixAt(slot, _m);
      groundLeafInst.instanceMatrix.needsUpdate = true;
      respawnLeaf(d);
    }
    if (d.x > 16) d.x -= 32; else if (d.x < -16) d.x += 32;
    if (d.z > 16) d.z -= 32; else if (d.z < -16) d.z += 32;
    _e.set(d.rx, d.ry, d.rz, 'XYZ');
    _q.setFromEuler(_e);
    _m.compose(_v.set(d.x, d.y, d.z), _q, _s.set(d.scale, d.scale, d.scale));
    leafInst.setMatrixAt(i, _m);
  }
  leafInst.instanceMatrix.needsUpdate = true;
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (game.state !== 'playing') return;
  pointerDown = true;
  dragging = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch (er) {}
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastMouseX;
  const dy = e.clientY - lastMouseY;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  yaw   -= dx * 0.0045 * sensitivity;
  pitch -= dy * 0.0045 * sensitivity;
  pitch = Math.max(-1.35, Math.min(1.35, pitch));
});
const endPointer = (e) => {
  dragging = false;
  pointerDown = false;
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (er) {}
};
renderer.domElement.addEventListener('pointerup', endPointer);
renderer.domElement.addEventListener('pointercancel', endPointer);
window.addEventListener('blur', () => { pointerDown = false; dragging = false; sprinting = false; });

document.querySelectorAll('button').forEach(b => {
  b.tabIndex = -1;
  b.addEventListener('mousedown', e => e.preventDefault());
});
document.addEventListener('keydown', (e) => {
  if (e.target && e.target.closest && e.target.closest('button')) e.preventDefault();
}, true);

function updateCamera(isMoving) {
  bobPhase += (isMoving ? (sprinting ? 0.42 : 0.26) : 0);
  const bob = isMoving ? Math.sin(bobPhase) * 0.035 : 0;
  camera.position.set(px, 1.68 + bob, pz);
  camera.rotation.set(pitch, yaw, 0);
}

/* =========================================================
   FLASHLIGHT
   ========================================================= */

let elapsed = 0;
function updateFlashlight(dt) {
  if (game.state !== 'playing') {
    flashlight.intensity = 0;
    return;
  }
  const swayX = Math.sin(elapsed * 1.1) * 0.010;
  const swayY = Math.cos(elapsed * 1.6) * 0.008;
  flashlight.position.x = 0.26 + swayX;
  flashlight.position.y = -0.16 + swayY;

  let b = 0;
  if (flashlightOn && !detector.reloading && detector.power > 0) {
    b = 0.08 + 0.92 * Math.pow(detector.power / 100, 0.7);
    if (detector.power < 25) {
      if (flickerT <= 0 && Math.random() < dt * 0.9) flickerT = 0.08 + Math.random() * 0.15;
      if (flickerT > 0) { flickerT -= dt; b *= 0.2; }
    }
  }
  flashlight.intensity = FLASH_BASE * b;
  motesMat.uniforms.uLightScale.value = flashlightOn ? 1.0 : 0.25;
}

/* =========================================================
   SKY / NIGHT PROGRESSION
   ========================================================= */

function updateSky(t) {
  const p = nightProgress();
  const dusk = 1 - sstep(0.0, 0.14, p);
  const dawn = sstep(0.78, 1.0, p);
  skyMat.uniforms.uDusk.value = dusk;
  skyMat.uniforms.uDawn.value = dawn;

  const starVis = sstep(0.05, 0.2, p) * (1 - sstep(0.85, 0.98, p));
  starMat.uniforms.uVis.value = starVis;
  starMat.uniforms.uTime.value = t;

  const moonAlt = 0.08 + 0.85 * Math.sin(p * Math.PI * 0.9);
  moon.position.copy(dirFromAz(MOON_AZ, moonAlt).multiplyScalar(200));
  moonMat.opacity = sstep(0.02, 0.18, p) * (1 - sstep(0.82, 0.96, p));

  const sunAlt = -0.12 + 0.82 * sstep(0.82, 1.0, p);
  sun.position.copy(dirFromAz(SUN_AZ, sunAlt).multiplyScalar(200));
  sunMat.opacity = sstep(0.8, 0.9, p);

  ambientLight.intensity = 0.14 + 0.4 * dawn;
  moonLight.intensity = 0.08 * (1 - dawn);
  sunLight.intensity = 0.9 * dawn;
  sunLight.position.copy(sunDirVec).multiplyScalar(60).add(camera.position);
  sunLight.target.position.set(px, 0, pz);

  skyGroup.position.set(px, 0, pz);
}

function smoothBodyGeometry(geo, amp, freq) {
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = 1
      + Math.sin(v.x * freq)       * amp
      + Math.cos(v.y * freq * 1.3) * amp
      + Math.sin(v.z * freq * 0.7) * amp;
    pos.setXYZ(i, v.x * n, v.y * n, v.z * n);
  }
  geo.computeVertexNormals();
}

  const mouthCavity = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), cavityMat);

  const gumUpperGeo = new THREE.CapsuleGeometry(0.018, 0.24, 4, 8);
  gumUpperGeo.rotateZ(Math.PI / 2);
  const gumUpper = new THREE.Mesh(gumUpperGeo, gumMat);
  gumUpper.position.set(0, -0.155, -0.30);

  for (let i = 0; i < 14; i++) {

    const len = 0.035 + Math.random() * 0.03;

    const tooth = new THREE.Mesh(new THREE.ConeGeometry(rad, len, 4), toothMat);

    tooth.rotation.z = (Math.random() - 0.5) * 0.35;
    tooth.rotation.y = (Math.random() - 0.5) * 0.3;
    head.add(tooth);
  }
  for (let i = 0; i < 8; i++) {
    if (Math.random() < 0.12) continue;
    const angle = (i / 7 - 0.5) * Math.PI * 0.85;
    const x = Math.sin(angle) * 0.10;
    const z = -0.20 - Math.cos(angle) * 0.18;
    const y = -0.15 - Math.abs(Math.sin(angle)) * 0.03 + (Math.random() - 0.5) * 0.008;
    const len = 0.028 + Math.random() * 0.022;
    const rad = 0.005 + Math.random() * 0.004;
    const tooth = new THREE.Mesh(new THREE.ConeGeometry(rad, len, 4), toothMat);
    tooth.position.set(x, y, z);
    tooth.rotation.x = Math.PI + (Math.random() - 0.5) * 0.25;
    tooth.rotation.z = (Math.random() - 0.5) * 0.4;
    head.add(tooth);
  }

  const jaw = new THREE.Group();
  jaw.position.set(0, -0.14, -0.16);
  jaw.rotation.x = -0.85;
  head.add(jaw);

  const jawGeo = new THREE.CylinderGeometry(0.07, 0.09, 0.28, 12, 2);
  jawGeo.rotateX(Math.PI / 2);
  const jawMesh = new THREE.Mesh(jawGeo, hideDarkMat);
  jawMesh.position.set(0, -0.01, -0.14);
  jaw.add(jawMesh);

  const gumLowerGeo = new THREE.CapsuleGeometry(0.016, 0.22, 4, 8);
  gumLowerGeo.rotateZ(Math.PI / 2);
  const gumLower = new THREE.Mesh(gumLowerGeo, gumMat);
  gumLower.position.set(0, 0.055, -0.13);
  jaw.add(gumLower);

  for (let i = 0; i < 14; i++) {
    if (Math.random() < 0.06) continue;
    const angle = (i / 13 - 0.5) * Math.PI;
    const x = Math.sin(angle) * 0.10;
    const z = -0.04 - Math.cos(angle) * 0.22;
    const y = 0.06 + Math.abs(Math.sin(angle)) * 0.008 + (Math.random() - 0.5) * 0.006;
    const len = 0.035 + Math.random() * 0.03;
    const rad = 0.006 + Math.random() * 0.005;
    const tooth = new THREE.Mesh(new THREE.ConeGeometry(rad, len, 4), toothMat);
    tooth.position.set(x, y, z);
    tooth.rotation.x = (Math.random() - 0.5) * 0.2;
    tooth.rotation.z = (Math.random() - 0.5) * 0.35;
    tooth.rotation.y = (Math.random() - 0.5) * 0.3;
    jaw.add(tooth);
  }
  for (let i = 0; i < 8; i++) {
    if (Math.random() < 0.12) continue;
    const angle = (i / 7 - 0.5) * Math.PI * 0.85;
    const x = Math.sin(angle) * 0.075;
    const z = -0.06 - Math.cos(angle) * 0.18;
    const y = 0.065 + (Math.random() - 0.5) * 0.005;

    tooth.rotation.z = (Math.random() - 0.5) * 0.4;

  }

  for (const sx of [-1, 1]) {
    const tongueGeo = new THREE.CapsuleGeometry(0.028, 0.13, 6, 8);
    tongueGeo.rotateX(Math.PI / 2);
    const tongue = new THREE.Mesh(tongueGeo, tongueMat);
    tongue.position.set(sx * 0.035, 0.04, -0.22);
    tongue.rotation.x = -0.55;
    tongue.rotation.z = sx * 0.08;
    jaw.add(tongue);
  }

  const droolStrings = [];
  for (let i = 0; i < 5; i++) {
    const len = 0.18 + Math.random() * 0.32;
    const droolGeo = new THREE.CylinderGeometry(0.004, 0.008, len, 4);
    const drool = new THREE.Mesh(droolGeo, droolMat);
    const side = i < 3 ? -1 : 1;
    drool.position.set(
      side * (0.05 + Math.random() * 0.05),
      -0.22 - len / 2,
      -0.32 - Math.random() * 0.05
    );
    drool.userData.baseY = drool.position.y;
    drool.userData.phase = Math.random() * Math.PI * 2;
    head.add(drool);
    droolStrings.push(drool);
  }

  const foamBits = [];
  for (let i = 0; i < 18; i++) {
    const fGeo = new THREE.SphereGeometry(0.02 + Math.random() * 0.03, 6, 6);
    const f = new THREE.Mesh(fGeo, foamMat);
    f.position.set(
      (Math.random() - 0.5) * 0.20,
      -0.14 - Math.random() * 0.22,
      -0.36 - Math.random() * 0.06
    );
    head.add(f);
    foamBits.push({ mesh: f, baseY: f.position.y, phase: Math.random() * Math.PI * 2 });
  }

  const legs = [];
  const legPos = [
    [-0.32,  0.55], [ 0.32,  0.55],
    [-0.34, -0.55], [ 0.34, -0.55]
  ];
  for (let i = 0; i < 4; i++) {
    const lg = new THREE.Group();
    lg.position.set(legPos[i][0], 0, legPos[i][1]);

    const upperGeo = new THREE.CylinderGeometry(0.065, 0.10, 0.58, 10, 3);
    smoothBodyGeometry(upperGeo, 0.012, 12);
    const upper = new THREE.Mesh(upperGeo, hideMat);
    upper.position.y = 0.72;
    lg.add(upper);

    const knee = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), hideMat);
    knee.position.y = 0.44;
    lg.add(knee);

    const lowerGeo = new THREE.CylinderGeometry(0.04, 0.06, 0.42, 10, 3);
    smoothBodyGeometry(lowerGeo, 0.01, 14);
    const lower = new THREE.Mesh(lowerGeo, hideMat);
    lower.position.y = 0.22;
    lg.add(lower);

    const hoof = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.048, 0.10, 8), hideDarkMat);
    hoof.position.y = 0.03;
    lg.add(hoof);

    if (i === 3) {
      upper.rotation.x = 0.16;
      lower.rotation.x = 0.38;
      lower.position.z = 0.10;
      hoof.position.z = 0.18;
    }

    legs.push({ group: lg, baseZ: legPos[i][1], baseX: legPos[i][0], phase: Math.random() * Math.PI * 2 });
    group.add(lg);
  }

  const tail = new THREE.Group();
  tail.position.set(0, 1.42, 0.92);
  group.add(tail);
  const tailMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.042, 0.72, 6, 3), hideMat);
  tailMesh.position.y = -0.36;
  tail.add(tailMesh);
  const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), hideDarkMat);
  tuft.scale.set(1, 1.4, 1);
  tuft.position.y = -0.75;
  tail.add(tuft);
  for (let i = 0; i < 4; i++) {
    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.06, 4), boneMat);
    spike.position.set(0, -0.15 - i * 0.15, 0.05);
    spike.rotation.x = -0.4;
    tail.add(spike);
  }

  group.traverse(o => {
    if (o.isMesh) {
      o.castShadow = false;
      o.receiveShadow = false;
      if (o.material) {
        o.material.userData.baseOpacity = o.material.opacity;
        if (o.material.emissiveIntensity !== undefined) {
          o.material.userData.baseEmissive = o.material.emissiveIntensity;
        }
      }
    }
  });

  return { group, head, jaw, legs, tail, foamBits, droolStrings };
}

class RabidCow {
  constructor() {
    const built = buildRabidCow();
    this.group = built.group;
    this.head = built.head;
    this.jaw = built.jaw;
    this.legs = built.legs;
    this.tail = built.tail;
    this.foamBits = built.foamBits;
    this.droolStrings = built.droolStrings;
    scene.add(this.group);

    this.currentPos = new THREE.Vector3(0, 0, -25);
    this.opacity = 0;
    this.walkPhase = 0;
    this.hoofTimer = 0;
    this.mooTimer = 12;
    this.jawTimer = 2;
    this.jawTarget = -0.85;
    this.headJerkTimer = 1.5;
    this.headJerkX = 0; this.headJerkZ = 0;
    this.headJerkTargetX = 0; this.headJerkTargetZ = 0;
    this.freezeGrace = 0.35;
    this.reset();
  }

  reset() {
    this.active = false;
    this.dormantTimer = 14;
    this.timeSinceLookedAt = 99;
    this.lungeT = 0;
    this.lungeCD = 5;
    this.lastDist = 99;
    this.lastLooked = false;
    this.group.visible = false;
    this.setOpacity(0);
    this.currentPos.set(px, 0, pz - 25);
    this.group.position.copy(this.currentPos);
  }

  setOpacity(v) {
    if (Math.abs(v - this.opacity) < 0.004) return;
    this.opacity = v;
    const show = v > 0.02;
    if (this.group.visible !== show) this.group.visible = show;
    this.group.traverse(o => {
      if (o.isMesh && o.material) {
        o.material.opacity = (o.material.userData.baseOpacity ?? 1) * v;
        if (o.material.userData.baseEmissive !== undefined) {
          o.material.emissiveIntensity = o.material.userData.baseEmissive * v;
        }
      }
    });
  }

  findPosAroundPlayer(minD, maxD) {
    for (let attempt = 0; attempt < 20; attempt++) {
      const ang = Math.random() * Math.PI * 2;
      const d = minD + Math.random() * (maxD - minD);
      const x = px + Math.cos(ang) * d;
      const z = pz + Math.sin(ang) * d;
      let blocked = false;
      const pcx = Math.floor(x / CHUNK), pcz = Math.floor(z / CHUNK);
      for (let dx = -1; dx <= 1 && !blocked; dx++) {
        for (let dz = -1; dz <= 1 && !blocked; dz++) {
          const ch = chunks.get((pcx + dx) + ',' + (pcz + dz));
          if (!ch) continue;
          for (const tr of ch.trees) {
            const ddx = x - tr.x, ddz = z - tr.z;
            if (ddx * ddx + ddz * ddz < (tr.r + 2) * (tr.r + 2)) { blocked = true; break; }
          }
        }
      }
      if (!blocked) return { x, z };
    }
    const ang = Math.random() * Math.PI * 2;
    const d = minD + Math.random() * (maxD - minD);
    return { x: px + Math.cos(ang) * d, z: pz + Math.sin(ang) * d };
  }

  activate() {
    this.active = true;
    const p = this.findPosAroundPlayer(20, 26);
    this.currentPos.set(p.x, 0, p.z);
    this.group.position.copy(this.currentPos);
    this.group.rotation.y = Math.random() * Math.PI * 2;
    this.group.visible = false;
    this.setOpacity(0);
    playCowMoo(this.currentPos, Math.hypot(p.x - px, p.z - pz), 1.0);
  }

  teleportToPlayerFront(dist) {
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    this.currentPos.set(px + fx * dist, 0, pz + fz * dist);
    this.group.position.copy(this.currentPos);
    const dx = px - this.currentPos.x, dz = pz - this.currentPos.z;
    this.group.rotation.y = Math.atan2(-dx, -dz);
    for (let i = 0; i < 4; i++) {
      this.legs[i].group.position.y = 0;
      this.legs[i].group.position.z = this.legs[i].baseZ;
    }
  }

  update(dt, t) {
    if (!this.active) {
      this.dormantTimer -= dt;
      if (this.dormantTimer <= 0 && game.t > 6) this.activate();
      return;
    }

    const aggr = nightAggression();
    const rx = this.currentPos.x - px;
    const rz = this.currentPos.z - pz;
    const dist = Math.hypot(rx, rz) || 0.001;
    const nx = rx / dist, nz = rz / dist;

    const camFx = -Math.sin(yaw), camFz = -Math.cos(yaw);
    const isLookedAt = (camFx * nx + camFz * nz) > 0.72 && dist < 45;

    if (isLookedAt) this.timeSinceLookedAt = 0;
    else this.timeSinceLookedAt += dt;

    const frozen = isLookedAt;
    const glitching = detector.glitchActive;

    this.lastDist = dist;
    this.lastLooked = isLookedAt;

    let isMoving = false;
    let walkSpeed = 0;

    if (this.lungeCD > 0) this.lungeCD -= dt;

    if (!glitching) {
      if (frozen) {
        this.lungeT = 0;
        if (dist < 9) {
          this.currentPos.x += nx * 1.2 * dt;
          this.currentPos.z += nz * 1.2 * dt;
          isMoving = true; walkSpeed = 1.2;
        }
      } else if (this.timeSinceLookedAt > this.freezeGrace) {
        if (this.lungeT > 0) {
          this.lungeT -= dt;
          const sp = 2.6 + aggr * 1.2;
          this.currentPos.x -= nx * sp * dt;
          this.currentPos.z -= nz * sp * dt;
          isMoving = true; walkSpeed = sp;
        } else {
          const targetDist = 11 - aggr * 7.8;
          if (dist > targetDist) {
            const urgency = Math.min(2.2, 1.0 + (dist - targetDist) * 0.06);
            const speed = (0.9 + 0.9 * aggr) * urgency * (flashlightOn ? 1.0 : 1.35);
            const towardX = -nx, towardZ = -nz;
            const wander = Math.sin(t * 0.22 + 0.7) * 0.35;
            const mx = towardX - towardZ * wander;
            const mz = towardZ + towardX * wander;
            const ml = Math.hypot(mx, mz) || 1;
            this.currentPos.x += (mx / ml) * speed * dt;
            this.currentPos.z += (mz / ml) * speed * dt;
            isMoving = true; walkSpeed = speed;
          } else if (dist < 6 && aggr < 0.5) {
            const p = this.findPosAroundPlayer(14, 20);
            this.currentPos.x = p.x;
            this.currentPos.z = p.z;
          }
          if (aggr > 0.35 && dist < targetDist + 1.5 && this.lungeCD <= 0) {
            this.lungeT = 0.9;
            this.lungeCD = (4.6 - 3.0 * aggr) + Math.random() * 2.0;
          }
        }
      }
    }

    if (isMoving && walkSpeed > 0.1) {
      this.walkPhase += dt * walkSpeed * 3.0;
      this.group.position.y = Math.abs(Math.sin(this.walkPhase)) * 0.05;
      for (let i = 0; i < 4; i++) {
        const lg = this.legs[i];
        const p = this.walkPhase + lg.phase;
        lg.group.position.z = lg.baseZ + Math.sin(p) * 0.12;
        lg.group.position.y = Math.max(0, Math.sin(p)) * 0.06;
      }
      this.hoofTimer -= dt;
      if (this.hoofTimer <= 0 && !frozen) {
        playHoofClick(this.currentPos, dist);
        this.hoofTimer = 0.5 + Math.random() * 0.35;
      }
    } else {
      this.group.position.y = 0;
      for (let i = 0; i < 4; i++) {
        this.legs[i].group.position.z = this.legs[i].baseZ;
        this.legs[i].group.position.y = 0;
      }
    }

    this.group.position.x = this.currentPos.x;
    this.group.position.z = this.currentPos.z;

    const gYaw = this.group.rotation.y;
    const hx = this.currentPos.x + HEAD_LZ * Math.sin(gYaw);
    const hz = this.currentPos.z + HEAD_LZ * Math.cos(gYaw);
    const hdx = px - hx, hdz = pz - hz;
    const desiredWorldYaw = Math.atan2(-hdx, -hdz);

    let dBodyYaw = desiredWorldYaw - gYaw;
    while (dBodyYaw > Math.PI)  dBodyYaw -= 2 * Math.PI;
    while (dBodyYaw < -Math.PI) dBodyYaw += 2 * Math.PI;
    const bodyTurnSpeed = frozen ? 0.35 : 1.6;
    this.group.rotation.y += dBodyYaw * Math.min(1, dt * bodyTurnSpeed);

    const newGYaw = this.group.rotation.y;
    let localTarget = desiredWorldYaw - newGYaw;
    while (localTarget > Math.PI)  localTarget -= 2 * Math.PI;
    while (localTarget < -Math.PI) localTarget += 2 * Math.PI;
    localTarget = Math.max(-2.09, Math.min(2.09, localTarget));

    let dHeadYaw = localTarget - this.head.rotation.y;
    while (dHeadYaw > Math.PI)  dHeadYaw -= 2 * Math.PI;
    while (dHeadYaw < -Math.PI) dHeadYaw += 2 * Math.PI;
    const headTurnSpeed = frozen ? 1.0 : 3.0;
    this.head.rotation.y += dHeadYaw * Math.min(1, dt * headTurnSpeed);

    this.headJerkTimer -= dt;
    if (this.headJerkTimer <= 0) {
      this.headJerkTargetZ = (Math.random() - 0.5) * (0.5 + 0.4 * aggr);
      this.headJerkTargetX = (Math.random() - 0.5) * (0.35 + 0.3 * aggr);
      this.headJerkTimer = (1.0 + Math.random() * 2.5) * (1 - 0.5 * aggr);
    }
    this.headJerkX += (this.headJerkTargetX - this.headJerkX) * Math.min(1, dt * 6);
    this.headJerkZ += (this.headJerkTargetZ - this.headJerkZ) * Math.min(1, dt * 6);
    this.head.rotation.x = this.headJerkX;
    this.head.rotation.z = this.headJerkZ;

    this.jawTimer -= dt;
    if (this.jawTimer <= 0) {
      this.jawTarget = -0.65 - Math.random() * (0.35 + 0.25 * aggr);
      this.jawTimer = (1.2 + Math.random() * 2.5) * (1 - 0.4 * aggr);
    }
    this.jaw.rotation.x += (this.jawTarget - this.jaw.rotation.x) * Math.min(1, dt * 5);

    this.tail.rotation.z = Math.sin(t * 1.7) * 0.14 + Math.sin(t * 5.3) * 0.04;
    this.tail.rotation.x = Math.sin(t * 0.9) * 0.08;

    for (const fb of this.foamBits) {
      fb.mesh.position.y = fb.baseY + Math.sin(t * 0.8 + fb.phase) * 0.015;
    }
    for (const dr of this.droolStrings) {
      dr.position.y = dr.userData.baseY + Math.sin(t * 1.2 + dr.userData.phase) * 0.008;
    }

    if (audioCtx && windGain && audioCtx.state === 'running') {
      const targetBase = (isLookedAt && dist < 30) ? 0.05 : 0.12;
      const cur = windGain.gain.value;
      windGain.gain.value = cur + (targetBase - cur) * Math.min(1, dt * 1.5);
    }

    this.mooTimer -= dt;
    if (this.mooTimer <= 0 && dist < 40 && !glitching) {
      playCowMoo(this.currentPos, dist, frozen ? 0.6 : 1.0 + 0.3 * aggr);
      const base = frozen ? 14 : 8;
      this.mooTimer = base * (1 - 0.5 * aggr) + Math.random() * 12 * (1 - 0.4 * aggr);
    }

    if (dist > 45 && !glitching) {
      const p = this.findPosAroundPlayer(18, 24);
      this.currentPos.x = p.x;
      this.currentPos.z = p.z;
    }
  }
}

  reloading: false,
  reloadProgress: 0,
  reloadDuration: 2.6,
  wasOnBeforeReload: false,

  glitchActive: false,
  glitchTimer: 0,

  glitchHold: 2.0,
  glitchFadeOut: 1.4,
  glitchCooldown: 30,
  glitchStartDist: 0
};

const btnLight    = document.getElementById('btnLight');
const btnDetector = document.getElementById('btnDetector');
const btnReload   = document.getElementById('btnReload');
const btnStamina  = document.getElementById('btnStamina');
const staminaFill = document.getElementById('staminaFill');
const actionEl    = document.getElementById('actionButtons');
const endEl       = document.getElementById('endScreen');
const endTextEl   = document.getElementById('endText');

let lowBatteryBeepTimer = 0;
let reloadTimeouts = [];

function toggleFlashlight() {
  if (game.state !== 'playing') return;
  flashlightOn = !flashlightOn;
  playSwitchClick();
  updateActionButtons();
}

function toggleDetector() {
  if (game.state !== 'playing' || detector.reloading) return;
  if (!detector.on && detector.power < 5) { playSwitchClick(); return; }
  detector.on = !detector.on;
  playDetectorToggleSound(detector.on);
  updateActionButtons();
}

function startReload() {
  if (game.state !== 'playing' || detector.reloading) return;
  if (detector.power >= 99.5) return;
  detector.reloading = true;
  detector.reloadProgress = 0;
  detector.wasOnBeforeReload = detector.on;
  detector.on = false;
  playReloadSoundSequence();
  updateActionButtons();
}

btnLight.addEventListener('click', toggleFlashlight);
btnDetector.addEventListener('click', toggleDetector);
btnReload.addEventListener('click', startReload);

btnStamina.addEventListener('pointerdown', (e) => {
  if (game.state !== 'playing') return;
  sprinting = true;
  try { btnStamina.setPointerCapture(e.pointerId); } catch (er) {}
});
const releaseSprint = (e) => {
  sprinting = false;
  try { btnStamina.releasePointerCapture(e.pointerId); } catch (er) {}
};
btnStamina.addEventListener('pointerup', releaseSprint);
btnStamina.addEventListener('pointercancel', releaseSprint);
btnStamina.addEventListener('lostpointercapture', () => { sprinting = false; });

function updateActionButtons() {
  btnLight.classList.toggle('on', flashlightOn);
  btnDetector.classList.toggle('on', detector.on);
  btnReload.classList.toggle('low', detector.power < 30 && !detector.reloading);
  btnStamina.classList.toggle('on', sprinting);
  staminaFill.style.width = stamina.toFixed(1) + '%';
}

function triggerGlitch() {
  detector.glitchActive = true;
  detector.glitchTimer = 0;
  detector.glitchStartDist = Math.hypot(cow.currentPos.x - px, cow.currentPos.z - pz);
  cow.teleportToPlayerFront(5.5 + Math.random() * 2.5);
  cow.setOpacity(0);
  playCowGlitchAppear();
}

function updateDetector(dt) {
  const aggr = nightAggression();

  if (detector.reloading) {
    detector.reloadProgress += dt / detector.reloadDuration;
    if (detector.reloadProgress >= 1) {
      detector.reloading = false;
      detector.power = 100;
      detector.on = detector.wasOnBeforeReload;
      playReloadComplete();
      updateActionButtons();
    }
  }

  if (!detector.reloading) {
    const drain = (flashlightOn ? 0.26 : 0.08) + (detector.on ? 0.42 : 0);
    detector.power = Math.max(0, detector.power - drain * dt);
    if (detector.power <= 0 && detector.on) {
      detector.on = false;
      playDetectorToggleSound(false);
      updateActionButtons();
    }
  }

  if (detector.on && detector.power < 22 && detector.power > 0) {
    lowBatteryBeepTimer -= dt;
    if (lowBatteryBeepTimer <= 0) {
      playLowBatteryBeep();
      lowBatteryBeepTimer = 1.4 + Math.random() * 0.6;
    }
  }

  if (detector.glitchCooldown > 0) detector.glitchCooldown -= dt;
  if (detector.on && !detector.reloading && !detector.glitchActive && detector.glitchCooldown <= 0 && cow.active) {
    const d = Math.hypot(cow.currentPos.x - px, cow.currentPos.z - pz);
    if (d > 14 && Math.random() < (0.06 + 0.10 * aggr) * dt) triggerGlitch();
  }

  if (detector.glitchActive) {
    detector.glitchTimer += dt;
    const T = detector.glitchTimer;
    const FI = detector.glitchFadeIn;
    const HO = detector.glitchHold;
    const FO = detector.glitchFadeOut;
    const TOTAL = FI + HO + FO;
    if (T < FI) {
      const k = T / FI;
      cow.setOpacity(k * k);
    } else if (T < FI + HO) {
      cow.setOpacity(1);
    } else if (T < TOTAL) {
      const k = 1 - (T - FI - HO) / FO;
      cow.setOpacity(k * k);
    } else {
      detector.glitchActive = false;
      cow.setOpacity(0);
      detector.glitchCooldown = (45 + Math.random() * 30) * (1 - 0.4 * aggr);
    }
  }
}

/* =========================================================
   AUDIO
   ========================================================= */

let audioCtx = null;
let noiseBuf = null;
let masterGain = null;
let windGain = null;

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = volumeLevel;
  masterGain.connect(audioCtx.destination);

  const len = audioCtx.sampleRate * 3;
  noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + 0.02 * w) / 1.02;
    data[i] = last * 3.4;
  }

  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 300; lp.Q.value = 0.6;
  windGain = audioCtx.createGain();
  windGain.gain.value = 0.12;
  src.connect(lp).connect(windGain).connect(masterGain);
  src.start();

  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.06;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 0.055;
  lfo.connect(lfoGain).connect(windGain.gain);
  lfo.start();

  const droneGain = audioCtx.createGain();
  droneGain.gain.value = 0.020;
  const droneLP = audioCtx.createBiquadFilter();
  droneLP.type = 'lowpass'; droneLP.frequency.value = 140; droneLP.Q.value = 0.7;
  const d1 = audioCtx.createOscillator(); d1.type = 'sine'; d1.frequency.value = 44;
  const d2 = audioCtx.createOscillator(); d2.type = 'sine'; d2.frequency.value = 44.4;
  const d3 = audioCtx.createOscillator(); d3.type = 'sine'; d3.frequency.value = 66;
  d1.connect(droneGain); d2.connect(droneGain); d3.connect(droneGain);
  droneGain.connect(droneLP).connect(masterGain);
  const droneLfo = audioCtx.createOscillator();
  droneLfo.frequency.value = 0.045;
  const droneLfoGain = audioCtx.createGain();
  droneLfoGain.gain.value = 0.010;
  droneLfo.connect(droneLfoGain).connect(droneGain.gain);
  droneLfo.start();
  d1.start(); d2.start(); d3.start();
}

function noiseBurst({ dur = 0.3, type = 'bandpass', freq = 800, q = 1, gain = 0.05, pan = 0, rate = 1, delay = 0 } = {}) {
  if (!audioCtx || audioCtx.state !== 'running' || !noiseBuf) return;
  const t = audioCtx.currentTime + delay;
  const s = audioCtx.createBufferSource();
  s.buffer = noiseBuf; s.playbackRate.value = rate;
  const f = audioCtx.createBiquadFilter();
  f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const p = audioCtx.createStereoPanner();
  p.pan.value = Math.max(-1, Math.min(1, pan));
  s.connect(f).connect(g).connect(p).connect(masterGain);
  s.start(t, Math.random() * 2, dur + 0.05);
}

function panFor(pos) {
  const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  const rx = pos.x - px, rz = pos.z - pz;
  const r = rx * camRight.x + rz * camRight.z;
  const len = Math.max(1, Math.hypot(rx, rz));
  return Math.max(-1, Math.min(1, r / len));
}

function playSwitchClick() {
  if (!audioCtx || audioCtx.state !== 'running' || !noiseBuf) return;
  const t = audioCtx.currentTime;
  const s = audioCtx.createBufferSource();
  s.buffer = noiseBuf; s.playbackRate.value = 2.8;
  const f = audioCtx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 4;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.09, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
  s.connect(f).connect(g).connect(masterGain);
  s.start(t, 0, 0.08);
}

function playDetectorToggleSound(on) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t0 = audioCtx.currentTime;
  for (let i = 0; i < 2; i++) {
    const o = audioCtx.createOscillator();
    o.type = 'square';
    o.frequency.setValueAtTime(on ? 660 + i * 220 : 880 - i * 220, t0 + i * 0.07);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0 + i * 0.07);
    g.gain.exponentialRampToValueAtTime(0.025, t0 + i * 0.07 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.07 + 0.06);
    o.connect(g).connect(masterGain);
    o.start(t0 + i * 0.07); o.stop(t0 + i * 0.07 + 0.08);
  }
}

function playLowBatteryBeep() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t0 = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  o.type = 'square';
  o.frequency.setValueAtTime(440, t0);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.03, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.06);
  o.connect(g).connect(masterGain);
  o.start(t0); o.stop(t0 + 0.08);
}

function playReloadSoundSequence() {
  reloadTimeouts.forEach(clearTimeout);
  reloadTimeouts = [
    setTimeout(() => noiseBurst({ dur: 0.08, type: 'bandpass', freq: 2200, q: 5, gain: 0.10 }), 40),
    setTimeout(() => noiseBurst({ dur: 0.12, type: 'bandpass', freq: 1800, q: 4, gain: 0.09 }), 500),
    setTimeout(() => noiseBurst({ dur: 0.40, type: 'lowpass', freq: 420, q: 1.5, gain: 0.06, rate: 0.65 }), 1100),
    setTimeout(() => noiseBurst({ dur: 0.15, type: 'bandpass', freq: 1600, q: 3, gain: 0.10 }), 2000),
    setTimeout(() => noiseBurst({ dur: 0.10, type: 'bandpass', freq: 2400, q: 5, gain: 0.11 }), 2400)
  ];
}

function playReloadComplete() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t0 = audioCtx.currentTime;
  for (let i = 0; i < 3; i++) {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = 440 + i * 220;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0 + i * 0.08);
    g.gain.exponentialRampToValueAtTime(0.035, t0 + i * 0.08 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.08 + 0.20);
    o.connect(g).connect(masterGain);
    o.start(t0 + i * 0.08); o.stop(t0 + i * 0.08 + 0.22);
  }
}

function playCowGlitchAppear() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t0 = audioCtx.currentTime;

  const o = audioCtx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(28, t0);
  o.frequency.linearRampToValueAtTime(22, t0 + 1.2);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.2);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.3);
  o.connect(g).connect(masterGain);
  o.start(t0); o.stop(t0 + 1.4);

  const s = audioCtx.createBufferSource();
  s.buffer = noiseBuf; s.playbackRate.value = 3.5;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 8;
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime(0.04, t0 + 0.4);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
  s.connect(bp).connect(g2).connect(masterGain);
  s.start(t0, 0, 1.0);

  setTimeout(() => {
    if (cow.active && game.state === 'playing') playCowMoo(cow.currentPos, 6, 1.6);
  }, 400);
}

function playCowMoo(pos, dist, strength = 1.0) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t0 = audioCtx.currentTime;
  const p = audioCtx.createStereoPanner();
  p.pan.value = panFor(pos);
  p.connect(masterGain);
  const distAtten = Math.max(0.10, Math.min(1.0, 16 / Math.max(1, dist)));

  const o1 = audioCtx.createOscillator();
  o1.type = 'sawtooth';
  o1.frequency.setValueAtTime(84 + Math.random() * 8, t0);
  o1.frequency.linearRampToValueAtTime(66, t0 + 0.7);
  o1.frequency.linearRampToValueAtTime(74, t0 + 1.5);

  const o2 = audioCtx.createOscillator();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(168, t0);
  o2.frequency.linearRampToValueAtTime(132, t0 + 0.7);
  o2.frequency.linearRampToValueAtTime(148, t0 + 1.5);

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 2.2;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.10 * strength * distAtten, t0 + 0.18);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);

  o1.connect(lp); o2.connect(lp);
  lp.connect(g).connect(p);
  o1.start(t0); o1.stop(t0 + 1.7);
  o2.start(t0); o2.stop(t0 + 1.7);

  noiseBurst({
    dur: 1.3, type: 'lowpass', freq: 250, q: 1,
    gain: 0.045 * strength * distAtten,
    pan: p.pan.value, rate: 0.55, delay: 0.15
  });
}

function playHoofClick(pos, dist) {
  if (!audioCtx || audioCtx.state !== 'running' || !noiseBuf) return;
  if (dist > 26) return;
  const t = audioCtx.currentTime;
  const p = audioCtx.createStereoPanner();
  p.pan.value = panFor(pos);
  p.connect(masterGain);
  const s = audioCtx.createBufferSource();
  s.buffer = noiseBuf; s.playbackRate.value = 1.8 + Math.random() * 0.5;
  const f = audioCtx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = 1300 + Math.random() * 500;
  f.Q.value = 5;
  const g = audioCtx.createGain();
  const distAtten = Math.max(0.15, Math.min(1, 14 / Math.max(1, dist)));
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.055 * distAtten, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  s.connect(f).connect(g).connect(p);
  s.start(t, Math.random() * 2, 0.1);
}

function playCreak() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  o.type = 'sawtooth';
  const f = 70 + Math.random() * 70;
  o.frequency.setValueAtTime(f, t);
  o.frequency.linearRampToValueAtTime(f * 0.6, t + 0.9);
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 500; lp.Q.value = 3;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.05, t + 0.15);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
  const p = audioCtx.createStereoPanner();
  p.pan.value = (Math.random() * 2 - 1) * 0.8;
  o.connect(lp).connect(g).connect(p).connect(masterGain);
  o.start(t); o.stop(t + 1.1);
}
function playRustle() {
  noiseBurst({ dur: 0.35 + Math.random() * 0.25, type: 'bandpass',
    freq: 1600 + Math.random() * 1800, q: 1.4, gain: 0.03,
    pan: (Math.random() * 2 - 1) * 0.9, rate: 0.9 + Math.random() * 0.5 });
}
function playOwl() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t0 = audioCtx.currentTime;
  const p = audioCtx.createStereoPanner();
  p.pan.value = (Math.random() * 2 - 1) * 0.95;
  p.connect(masterGain);
  const hoot = (delay, freq, dur, vol) => {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t0 + delay);
    o.frequency.exponentialRampToValueAtTime(freq * 0.82, t0 + delay + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0 + delay);
    g.gain.exponentialRampToValueAtTime(vol, t0 + delay + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + delay + dur);
    o.connect(g).connect(p);
    o.start(t0 + delay); o.stop(t0 + delay + dur + 0.05);
  };
  const base = 340 + Math.random() * 60;
  hoot(0, base + 40, 0.55, 0.055);
  hoot(0.75, base + 10, 0.60, 0.048);
  hoot(1.65, base, 0.75, 0.040);
}

let fpsAccum = 0, fpsFrames = 0, lowFpsTime = 0;
function updateFPS(dt) {
  fpsAccum += dt; fpsFrames++;
  if (fpsAccum >= 0.5) {
    const fps = Math.round(fpsFrames / fpsAccum);
    if (fps < 40) lowFpsTime += 0.5; else lowFpsTime = Math.max(0, lowFpsTime - 0.5);
    if (lowFpsTime > 3 && renderer.getPixelRatio() > 1.0) {
      renderer.setPixelRatio(Math.max(1.0, renderer.getPixelRatio() - 0.35));
      renderer.setSize(window.innerWidth, window.innerHeight);
      updatePointScale();
      lowFpsTime = 0;
    }
    fpsAccum = 0; fpsFrames = 0;
  }
}
