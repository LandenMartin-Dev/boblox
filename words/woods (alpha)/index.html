btnBack.addEventListener('click', () => {
  game.state = 'menu';
  mainCol.classList.add('show');
  settingsCol.classList.remove('show');
});
btnExit.addEventListener('click', () => {
  window.location.href = HOME_URL;
});
sensRange.addEventListener('input', () => { sensitivity = parseFloat(sensRange.value); });
volRange.addEventListener('input', () => {
  volumeLevel = parseFloat(volRange.value) * 0.9;
  if (masterGain) masterGain.gain.value = volumeLevel;
});

/* Enable CONTINUE button after 8s reveal (pointer-events are not animatable). */
function armContinueButton() {
  setTimeout(() => { contBtn.classList.add('ready'); }, 8000);
}

/* =========================================================
   LOADING SEQUENCE (monotonic progress)
   ========================================================= */

let loadProgress = 0;
function setLoad(p) {
  loadProgress = Math.max(loadProgress, Math.min(1, p));
  loadFillEl.style.width = (loadProgress * 100).toFixed(0) + '%';
  loadPctEl.textContent = Math.round(loadProgress * 100) + '%';
}

function runLoading() {
  setLoad(0);
  // First: prebuild all chunks (heavy) - happens after a short paint.
  setTimeout(() => {
    for (let cx = -VIEW; cx <= VIEW; cx++) {
      for (let cz = -VIEW; cz <= VIEW; cz++) buildChunk(cx, cz);
    }
    setLoad(0.55);

    // Then step the bar to 100%
    let step = 0;
    const totalSteps = 5;
    const tick = () => {
      step++;
      setLoad(0.55 + 0.45 * (step / totalSteps));
      if (step < totalSteps) {
        setTimeout(tick, 160 + Math.random() * 140);
      } else {
        setTimeout(() => {
          loadingEl.classList.remove('show');
          disclaimerEl.classList.add('show');
          game.state = 'disclaimer';
          armContinueButton();
        }, 350);
      }
    };
    tick();
  }, 60);
}

/* =========================================================
   RESIZE / MAIN LOOP
   ========================================================= */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  updatePointScale();
});

updatePointScale();

const clock = new THREE.Clock();
let frameCount = 0;

function animate() {
  requestAnimationFrame(animate);
  let dt = clock.getDelta();
  if (dt > 0.1) dt = 0.1;
  elapsed += dt;
  frameCount++;

  if (game.state === 'loading' || game.state === 'disclaimer' || game.state === 'menu' || game.state === 'settings') {
    updateMenuScene(elapsed);
    renderer.render(menuScene, menuCam);
    return;
  }

  if (game.state === 'playing') {
    game.t += dt;

    const sprintNow = sprinting && pointerDown && stamina > 0.5;
    if (sprintNow) {
      stamina = Math.max(0, stamina - 26 * dt);
      staminaRegenDelay = 0.8;
    } else {
      staminaRegenDelay = Math.max(0, staminaRegenDelay - dt);
      if (staminaRegenDelay <= 0) stamina = Math.min(100, stamina + 18 * dt);
    }
    moving = pointerDown;
    if (moving) {
      const sp = sprintNow ? 4.4 : 2.2;
      px += -Math.sin(yaw) * sp * dt;
      pz += -Math.cos(yaw) * sp * dt;
    }
    resolveTrees();
    updateChunks();

    grassUniforms.uTime.value = elapsed;
    cow.update(dt, elapsed);
    updateDetector(dt);

    if (cow.active && !cow.lastLooked && cow.lastDist < 1.4 && !detector.glitchActive) {
      endGame('dead');
    }
    if (game.t >= NIGHT_SEC) {
      endGame('dawn');
    }
    updateActionButtons();
  }

  if (game.state === 'playing' || game.state === 'ended') {
    ground.position.set(Math.round(px / GROUND_TILE) * GROUND_TILE, 0, Math.round(pz / GROUND_TILE) * GROUND_TILE);
    motes.position.set(px, 0, pz);
    fireflies.position.set(px, 0, pz);
    leafInst.position.set(px, 0, pz);

    updateCamera(moving);
    updateSky(elapsed);

    if ((frameCount & 1) === 0) {
      updateMotes(dt * 2, elapsed);
      updateFireflies(dt * 2, elapsed);
      updateLeaves(dt * 2, elapsed);
    }
    updateFlashlight(dt);
    updateAudio(dt);
    updateFPS(dt);

    renderer.render(scene, camera);
  }
}

runLoading();
animate();
</script>
