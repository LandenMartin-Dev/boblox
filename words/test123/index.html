<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>test123</title>
<meta name="description" content="An interactive spatial walkthrough of an abstract interior layout." />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d0a05;
    overflow: hidden;
    font-family: system-ui, sans-serif;
    color: #fff5d2;
  }
  #stage {
    position: fixed;
    inset: 0;
    cursor: pointer;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: absolute;
    left: 14px;
    bottom: 12px;
    color: rgba(255,245,210,0.55);
    font-size: 12px;
    letter-spacing: .04em;
    pointer-events: none;
    user-select: none;
  }

  /* ---------- Loading screen ---------- */
  #loader {
    position: fixed;
    inset: 0;
    background: #0d0a05;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 0.6s ease;
  }
  #loader.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #loader-title {
    font-size: 22px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #d8c98a;
    margin-bottom: 18px;
    opacity: 0.85;
  }
  #bar-track {
    width: min(420px, 70vw);
    height: 10px;
    background: #221c0e;
    border: 1px solid #3a3320;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
  }
  #bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8a7430, #e0c86a);
    box-shadow: 0 0 12px rgba(224,200,106,0.4);
    transition: width 0.15s linear;
  }
  #loader-text {
    margin-top: 14px;
    font-size: 12px;
    letter-spacing: .08em;
    color: rgba(216,201,138,0.7);
    min-height: 16px;
    text-align: center;
  }
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loader">
  <div id="loader-title">Preparing Space</div>
  <div id="bar-track"><div id="bar-fill"></div></div>
  <div id="loader-text">booting…</div>
</div>

<div id="stage">
  <div id="hint">hold click to advance · move mouse to aim · scroll to dolly</div>
</div>

<script type="module">
/* ============================================================
   LOADING SCREEN HELPERS
   ============================================================ */
const loaderEl = document.getElementById('loader');
const fillEl   = document.getElementById('bar-fill');
const statusEl = document.getElementById('loader-text');

let loadPct = 0;
function setLoad(pct, label) {
  loadPct = Math.max(loadPct, Math.min(100, pct));
  fillEl.style.width = loadPct + '%';
  if (label) statusEl.textContent = label;
  if (loadPct >= 100) {
    setTimeout(() => {
      loaderEl.classList.add('hidden');
      setTimeout(() => loaderEl.remove(), 700);
    }, 220);
  }
}
const yieldFrame = () => new Promise(r => requestAnimationFrame(() => r()));

/* ============================================================
   MODULE LOADING
   ============================================================ */
setLoad(3, 'loading three.js…');
const TMO = 4000;
const _ti = (u) => Promise.race([
  import(u),
  new Promise((_, r) => setTimeout(() => r(new Error('t')), TMO)),
]);
async function _ta(urls) {
  for (const u of urls) { try { return await _ti(u); } catch (e) {} }
  return null;
}

const _T = await _ta([
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://esm.sh/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
]);
if (!_T) { setLoad(100, 'failed to load engine'); throw new Error('module load failed'); }
setLoad(15, 'loading loaders…');
await yieldFrame();

let _GL = null, _FL = null;
try { const m = await _ta([
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js',
  'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js',
]); if (m) _GL = m.GLTFLoader; } catch (e) {}
setLoad(22, 'loading loaders…');
await yieldFrame();
try { const m = await _ta([
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js',
  'https://esm.sh/three@0.160.0/examples/jsm/loaders/FBXLoader.js',
]); if (m) _FL = m.FBXLoader; } catch (e) {}
setLoad(30, 'building scene…');
await yieldFrame();

/* ============================================================
   SETUP
   ============================================================ */
const C = _T.MathUtils.clamp;
const stage = document.getElementById('stage');
const R = new _T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
R.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
R.shadowMap.enabled = true;
R.shadowMap.type = _T.PCFSoftShadowMap;
R.outputColorSpace = _T.SRGBColorSpace;
R.toneMapping = _T.ACESFilmicToneMapping;
stage.appendChild(R.domElement);

const scene = new _T.Scene();
scene.background = new _T.Color(0xb9a44e);
scene.fog = new _T.Fog(0xb9a44e, 10, 50);

const cam = new _T.PerspectiveCamera(70, 1, 0.05, 150);

/* ============================================================
   PROCEDURAL TEXTURES
   ============================================================ */
function tex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new _T.CanvasTexture(c);
  t.colorSpace = _T.SRGBColorSpace;
  t.wrapS = t.wrapT = _T.RepeatWrapping; t.anisotropy = 4;
  return t;
}

setLoad(36, 'painting walls…');
await yieldFrame();

const wallTex = tex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#c4b06a'; ctx.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 32) {
    ctx.fillStyle = 'rgba(255,248,200,.05)'; ctx.fillRect(x, 0, 16, h);
    ctx.fillStyle = 'rgba(60,45,12,.05)'; ctx.fillRect(x + 16, 0, 16, h);
  }
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 18; d[i] += n; d[i + 1] += n; d[i + 2] += n * .7; }
  ctx.putImageData(img, 0, 0);
  for (let i = 0; i < 30; i++) {
    const x = Math.random() * w, y = Math.random() * h, r = 20 + Math.random() * 85;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(110,82,28,${.05 + Math.random() * .1})`);
    g.addColorStop(1, 'rgba(110,82,28,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  const bh = h * .05;
  ctx.fillStyle = '#6e5a35'; ctx.fillRect(0, h - bh, w, bh);
  ctx.fillStyle = 'rgba(255,240,180,.14)'; ctx.fillRect(0, h - bh, w, 2);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, h - 2, w, 2);
});

setLoad(44, 'painting floor…');
await yieldFrame();

const floorTex = tex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#9a8738'; ctx.fillRect(0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 44; d[i] += n; d[i + 1] += n; d[i + 2] += n * .7; }
  ctx.putImageData(img, 0, 0);
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * w, y = Math.random() * h, l = 2 + Math.random() * 4, a = Math.random() * Math.PI;
    ctx.strokeStyle = `rgba(${60 + Math.random() * 90},${55 + Math.random() * 80},${15 + Math.random() * 40},${.12 + Math.random() * .2})`;
    ctx.lineWidth = .7; ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke();
  }
  for (let i = 0; i < 22; i++) {
    const x = Math.random() * w, y = Math.random() * h, r = 12 + Math.random() * 52;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(50,38,12,${.08 + Math.random() * .14})`);
    g.addColorStop(1, 'rgba(50,38,12,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
});

setLoad(51, 'painting ceiling…');
await yieldFrame();

const ceilTex = tex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#d3caa0'; ctx.fillRect(0, 0, w, h);
  const t = w / 2;
  for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) {
    ctx.fillStyle = `rgba(${180 + Math.random() * 30},${170 + Math.random() * 30},${120 + Math.random() * 40},.22)`;
    ctx.fillRect(tx * t + 3, ty * t + 3, t - 6, t - 6);
    for (let i = 0; i < 40; i++) {
      ctx.fillStyle = 'rgba(90,80,45,.16)';
      ctx.beginPath();
      ctx.arc(tx * t + 8 + Math.random() * (t - 16), ty * t + 8 + Math.random() * (t - 16), 1 + Math.random() * 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.strokeStyle = 'rgba(80,70,38,.5)'; ctx.lineWidth = 4;
  ctx.strokeRect(0, 0, w, h);
  ctx.beginPath(); ctx.moveTo(t, 0); ctx.lineTo(t, h); ctx.moveTo(0, t); ctx.lineTo(w, t); ctx.stroke();
});

setLoad(58, 'placing lights…');
await yieldFrame();

/* ============================================================
   LIGHTS
   ============================================================ */
scene.add(new _T.HemisphereLight(0xfff0b8, 0x2b240d, 1.05));
const key = new _T.DirectionalLight(0xfff4cc, 1.35);
key.position.set(4, 12, 4); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0012;
const sc = key.shadow.camera;
sc.left = -20; sc.right = 20; sc.top = 20; sc.bottom = -20; sc.near = 1; sc.far = 50;
scene.add(key); scene.add(key.target);
const focus = new _T.PointLight(0xffe8a8, 14, 15, 2);
scene.add(focus);

setLoad(64, 'raising walls…');
await yieldFrame();

/* ============================================================
   MAP
   ============================================================ */
const WH = 6.0, WT = 0.6, MS = 120;
const boxes = [];

function wall(x, z, w, d) {
  const m = new _T.Mesh(
    new _T.BoxGeometry(w, WH, d),
    new _T.MeshStandardMaterial({ map: wallTex, roughness: .95 })
  );
  m.position.set(x, WH / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  boxes.push({ minX: x - w/2, maxX: x + w/2, minZ: z - d/2, maxZ: z + d/2 });
}

wall(0, -MS/2, MS, WT);
wall(0, MS/2, MS, WT);
wall(-MS/2, 0, WT, MS);
wall(MS/2, 0, WT, MS);

for (let x = -MS/2 + 10; x < MS/2 - 10; x += 20) {
  for (let z = -MS/2 + 10; z < MS/2 - 10; z += 20) {
    if (Math.hypot(x, z) < 10) continue;
    const r = Math.random();
    if (r < 0.3) {
      wall(x, z, 8, 1); wall(x - 3.5, z - 3.5, 1, 8);
    } else if (r < 0.6) {
      wall(x, z, 10, 1.5); wall(x, z, 1.5, 10);
    } else if (r < 0.8) {
      wall(x, z, 12, 1); wall(x + 6, z + 6, 1, 12);
    } else {
      wall(x-2, z-2, 2, 2); wall(x+2, z-2, 2, 2);
      wall(x-2, z+2, 2, 2); wall(x+2, z+2, 2, 2);
    }
  }
}

const fl = new _T.Mesh(
  new _T.PlaneGeometry(MS * 2, MS * 2),
  new _T.MeshStandardMaterial({ map: floorTex, roughness: 1 })
);
fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; scene.add(fl);

const ce = new _T.Mesh(
  new _T.PlaneGeometry(MS * 2, MS * 2),
  new _T.MeshStandardMaterial({ map: ceilTex, roughness: 1, side: _T.DoubleSide })
);
ce.rotation.x = Math.PI / 2; ce.position.y = WH; ce.receiveShadow = true; scene.add(ce);

const lm = new _T.MeshBasicMaterial({ color: 0xfff6c4 });
for (let x = -40; x <= 40; x += 20) {
  for (let z = -40; z <= 40; z += 20) {
    const p = new _T.Mesh(new _T.PlaneGeometry(2.5, 2.5), lm);
    p.rotation.x = Math.PI / 2; p.position.set(x, WH - 0.02, z); scene.add(p);
  }
}

setLoad(72, 'building figures…');
await yieldFrame();

/* ============================================================
   FIGURES
   ============================================================ */
const mkBox = (w, h, d, mat) => {
  const m = new _T.Mesh(new _T.BoxGeometry(w, h, d), mat);
  m.castShadow = true; m.receiveShadow = true; return m;
};

const viewer = new _T.Group(); scene.add(viewer);
const viewerVis = new _T.Group(); viewer.add(viewerVis);
const drifter = new _T.Group(); scene.add(drifter);
const drifterVis = new _T.Group(); drifter.add(drifterVis);

let vRig = null, dRig = null;
let vMix = null, dMix = null;

function buildVRig() {
  const root = new _T.Group();
  const sk = new _T.MeshStandardMaterial({ color: 0xf2c14e, roughness: .85 });
  const sh = new _T.MeshStandardMaterial({ color: 0x2f6fbf, roughness: .9 });
  const pn = new _T.MeshStandardMaterial({ color: 0x3f6f3f, roughness: .9 });
  const to = mkBox(.7, .7, .36, sh); to.position.y = 1.05; root.add(to);
  const hd = mkBox(.42, .42, .42, sk); hd.position.y = 1.62; root.add(hd);
  const lb = (x, y, w, h, d, mat) => {
    const p = new _T.Group(); p.position.set(x, y, 0);
    const m = mkBox(w, h, d, mat); m.position.y = -h / 2; p.add(m); root.add(p); return p;
  };
  return { root,
    armL: lb(-.49, 1.4, .24, .66, .24, sk), armR: lb(.49, 1.4, .24, .66, .24, sk),
    legL: lb(-.17, .7, .27, .7, .3, pn), legR: lb(.17, .7, .27, .7, .3, pn) };
}

function buildDRig() {
  const root = new _T.Group();
  const su = new _T.MeshStandardMaterial({ color: 0x1a1a1a, roughness: .9 });
  const sk = new _T.MeshStandardMaterial({ color: 0xd8d2bc, roughness: .9 });
  const ey = new _T.MeshStandardMaterial({ color: 0xff0000, emissive: 0x880000 });
  const ll = 1.0;
  const lL = new _T.Group(); lL.position.set(-.2, 1.0, 0); root.add(lL);
  const lLM = mkBox(.25, ll, .25, su); lLM.position.y = -ll/2; lL.add(lLM);
  const lR = new _T.Group(); lR.position.set(.2, 1.0, 0); root.add(lR);
  const lRM = mkBox(.25, ll, .25, su); lRM.position.y = -ll/2; lR.add(lRM);
  const to = mkBox(.65, .9, .35, su); to.position.y = 1.5; root.add(to);
  const hd = mkBox(.4, .4, .4, sk); hd.position.y = 2.15; root.add(hd);
  const eL = new _T.Mesh(new _T.SphereGeometry(.06, 10, 10), ey); eL.position.set(-.1, 2.2, .21); root.add(eL);
  const eR = new _T.Mesh(new _T.SphereGeometry(.06, 10, 10), ey); eR.position.set(.1, 2.2, .21); root.add(eR);
  const aL = new _T.Group(); aL.position.set(-.4, 1.8, 0); root.add(aL);
  const aLM = mkBox(.15, .9, .15, su); aLM.position.y = -.45; aL.add(aLM);
  const aR = new _T.Group(); aR.position.set(.4, 1.8, 0); root.add(aR);
  const aRM = mkBox(.15, .9, .15, su); aRM.position.y = -.45; aR.add(aRM);
  return { root, armL: aL, armR: aR, legL: lL, legR: lR };
}

vRig = buildVRig(); viewerVis.add(vRig.root);
dRig = buildDRig(); drifterVis.add(dRig.root);

/* ============================================================
   ASSET LOADING (real — progress bar tracks each file)
   ============================================================ */
function expand(ps) {
  const e = ['.png', '.jpg', '.jpeg', '.webp'], out = [];
  for (const p of ps) {
    if (/\.(png|jpe?g|webp)$/i.test(p)) out.push(p);
    else for (const x of e) out.push(p + x);
  }
  return out;
}

function firstTex(ps) {
  return new Promise(res => {
    const ld = new _T.TextureLoader(), list = expand(ps);
    let i = 0;
    const next = () => {
      if (i >= list.length) return res(null);
      ld.load(list[i++], t => {
        t.colorSpace = _T.SRGBColorSpace; t.anisotropy = 4;
        t.wrapS = t.wrapT = _T.RepeatWrapping; res(t);
      }, undefined, next);
    };
    next();
  });
}

async function firstModel(paths) {
  for (const url of paths) {
    const ext = url.split('.').pop().toLowerCase();
    try {
      if (ext === 'fbx' && _FL) return { object: await new _FL().loadAsync(url), animations: [] };
      if ((ext === 'glb' || ext === 'gltf') && _GL) {
        const g = await new _GL().loadAsync(url);
        return { object: g.scene, animations: g.animations || [] };
      }
    } catch (e) {}
  }
  return null;
}

function fit(obj, height) {
  obj.updateMatrixWorld(true);
  let b = new _T.Box3().setFromObject(obj), s = new _T.Vector3(); b.getSize(s);
  if (s.y > 1e-5) { obj.scale.multiplyScalar(height / s.y); obj.updateMatrixWorld(true); b = new _T.Box3().setFromObject(obj); }
  const c = new _T.Vector3(); b.getCenter(c);
  obj.position.x -= c.x; obj.position.z -= c.z; obj.position.y -= b.min.y;
  return obj;
}

function prep(obj, fbTex) {
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const ms = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of ms) {
      if (!m) continue;
      if (fbTex && 'map' in m && !m.map) { m.map = fbTex; m.needsUpdate = true; }
      if ('roughness' in m) m.roughness = Math.min(1, m.roughness ?? .9);
    }
  });
}

// ---- Audio loading (theme.mp3) ----
let themeEl = null;
function loadAudio(url, onProgress) {
  return new Promise(res => {
    const a = new Audio();
    a.preload = 'auto';
    a.loop = true;
    a.volume = 0;
    let done = false;
    const finish = (ok) => { if (done) return; done = true; res(ok ? a : null); };
    a.addEventListener('canplaythrough', () => finish(true), { once: true });
    a.addEventListener('loadeddata', () => { if (onProgress) onProgress(); }, { once: true });
    a.addEventListener('error', () => finish(false), { once: true });
    a.src = url;
    // fallback if browser doesn't fire canplaythrough in this context
    setTimeout(() => { if (!done && a.readyState >= 2) finish(true); }, 3500);
    setTimeout(() => { if (!done) finish(false); }, 6000);
  });
}

async function loadAllAssets() {
  // Player model + texture
  setLoad(78, 'loading figure model…'); await yieldFrame();
  const [vM, vT] = await Promise.all([
    firstModel(['assets/player.fbx', 'assets/player.glb', 'assets/player.gltf']),
    firstTex(['assets/texters/player/player', 'assets/texters/player/texture'])
  ]);
  setLoad(84, 'applying figure…'); await yieldFrame();
  if (vM) {
    const m = fit(vM.object, 1.85); prep(m, vT);
    viewerVis.remove(vRig.root); viewerVis.add(m); vRig = null;
    if (vM.animations.length) {
      vMix = new _T.AnimationMixer(m);
      const ic = vM.animations.find(c => /idle|stand/i.test(c.name)) || vM.animations[0];
      if (ic) vMix.clipAction(ic).play();
    }
  }

  // Entity model + texture
  setLoad(88, 'loading entity model…'); await yieldFrame();
  const [dM, dT] = await Promise.all([
    firstModel(['assets/entaty.glb', 'assets/entaty.gltf', 'assets/entity.glb', 'assets/entity.gltf']),
    firstTex(['assets/texters/entity/entity', 'assets/texters/entity/texture'])
  ]);
  setLoad(93, 'applying entity…'); await yieldFrame();
  if (dM) {
    const m = fit(dM.object, 2.2); prep(m, dT);
    drifterVis.remove(dRig.root); drifterVis.add(m); dRig = null;
    if (dM.animations.length) {
      dMix = new _T.AnimationMixer(m);
      const rc = dM.animations.find(c => /run|walk|move/i.test(c.name)) || dM.animations[0];
      if (rc) dMix.clipAction(rc).play();
    }
  }

  // Theme audio
  setLoad(96, 'loading theme…'); await yieldFrame();
  themeEl = await loadAudio('assets/sounds/theme.mp3', () => setLoad(98, 'loading theme…'));
  setLoad(99, 'finishing…'); await yieldFrame();

  // If audio failed, don't block — still finish
  setLoad(100, 'ready');
}

/* ============================================================
   STATE
   ============================================================ */
const vPos = new _T.Vector3(0, 0, 0);
const dPos = new _T.Vector3(30, 0, 30);
const dVel = new _T.Vector3(0, 0, 0);
let dHeading = 0;

let oYaw = 0, oPitch = 0.18, oDist = 6.5;
let tYaw = 0, tPitch = 0.18, tDist = 6.5;

let holding = false;
const WALK_SPEED = 9.0;
const vHeading = { y: Math.PI };

// --- Monster: fast, low friction => slides ---
const MON_ACCEL   = 55;
const MON_MAXSPD  = 15;
const MON_FRICTION = 0.35;
const MON_TURN     = 3.0;

let nWall = [], nTimer = 0;
function refreshNear() {
  const R2 = 15; nWall.length = 0;
  for (const w of boxes) {
    if (vPos.x > w.minX - R2 && vPos.x < w.maxX + R2 &&
        vPos.z > w.minZ - R2 && vPos.z < w.maxZ + R2) nWall.push(w);
  }
}

function resolve(pos, rad, vel) {
  for (let it = 0; it < 3; it++) {
    let hit = false;
    for (const w of boxes) {
      if (pos.x < w.minX - rad || pos.x > w.maxX + rad ||
          pos.z < w.minZ - rad || pos.z > w.maxZ + rad) continue;
      const cx = pos.x < w.minX ? w.minX : (pos.x > w.maxX ? w.maxX : pos.x);
      const cz = pos.z < w.minZ ? w.minZ : (pos.z > w.maxZ ? w.maxZ : pos.z);
      const dx = pos.x - cx, dz = pos.z - cz, d2 = dx * dx + dz * dz;
      if (d2 >= rad * rad) continue;
      hit = true;
      let nx = 0, nz = 0;
      if (d2 > 1e-9) {
        const d = Math.sqrt(d2), push = (rad - d) / d;
        pos.x += dx * push; pos.z += dz * push;
        nx = dx / d; nz = dz / d;
      } else {
        const dl = pos.x - w.minX, dr = w.maxX - pos.x, dt = pos.z - w.minZ, db = w.maxZ - pos.z;
        const m = Math.min(dl, dr, dt, db);
        if (m === dl) { pos.x = w.minX - rad; nx = -1; }
        else if (m === dr) { pos.x = w.maxX + rad; nx = 1; }
        else if (m === dt) { pos.z = w.minZ - rad; nz = -1; }
        else { pos.z = w.maxZ + rad; nz = 1; }
      }
      if (vel) {
        const dot = vel.x * nx + vel.z * nz;
        if (dot < 0) {
          vel.x -= dot * nx;
          vel.z -= dot * nz;
          vel.x *= 0.98;
          vel.z *= 0.98;
        }
      }
    }
    if (!hit) break;
  }
}

function camLimit(target, dir, maxD) {
  const step = .2, pad = .2;
  for (let d = .5; d <= maxD; d += step) {
    const px = target.x + dir.x * d, py = target.y + dir.y * d, pz = target.z + dir.z * d;
    if (py < .22 || py > WH - .18) return Math.max(d - step, .4);
    for (const w of nWall) {
      if (px > w.minX - pad && px < w.maxX + pad && pz > w.minZ - pad && pz < w.maxZ + pad) {
        return Math.max(d - step, .4);
      }
    }
  }
  return maxD;
}

function resetMonster() {
  let px, pz;
  do {
    px = (Math.random() - 0.5) * (MS - 20);
    pz = (Math.random() - 0.5) * (MS - 20);
  } while (Math.hypot(px - vPos.x, pz - vPos.z) < 30);
  dPos.set(px, 0, pz);
  dVel.set(0, 0, 0);
  dHeading = Math.random() * Math.PI * 2;
}
resetMonster();

/* ============================================================
   INPUT — hold click to advance, move mouse to aim
   ============================================================ */
const cv = R.domElement;
let lastX = 0, lastY = 0;

function resumeAudio() {
  if (themeEl && themeEl.paused) {
    themeEl.play().catch(() => {});
  }
}

cv.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  holding = true;
  lastX = e.clientX; lastY = e.clientY;
  resumeAudio();
});
window.addEventListener('mouseup', () => { holding = false; });

window.addEventListener('mousemove', (e) => {
  if (!holding) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  tYaw   -= dx * 0.005;
  tPitch -= dy * 0.004;
  tPitch  = C(tPitch, -0.9, 1.2);
});
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  tDist = C(tDist + d * 0.01, 1.5, 14);
}, { passive: false });

function resize() {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  R.setSize(innerWidth, innerHeight, false);
}
window.addEventListener('resize', resize);

/* ============================================================
   LOOP
   ============================================================ */
const clock = new _T.Clock();
let vWalk = 0, dWalk = 0;

function step(dt) {
  nTimer -= dt; if (nTimer <= 0) { nTimer = .15; refreshNear(); }

  const k = 1 - Math.exp(-10 * dt);
  oYaw   += (tYaw   - oYaw)   * k;
  oPitch += (tPitch - oPitch) * k;
  oDist  += (tDist  - oDist)  * k;

  // --- viewer movement ---
  const fx = -Math.sin(oYaw);
  const fz = -Math.cos(oYaw);
  if (holding) {
    vPos.x += fx * WALK_SPEED * dt;
    vPos.z += fz * WALK_SPEED * dt;
    resolve(vPos, 0.4, null);
    vWalk += dt * WALK_SPEED * 2.6;
    vHeading.y = Math.atan2(fx, fz);
  }

  viewer.position.copy(vPos);
  viewer.rotation.y = vHeading.y;
  if (vRig) {
    const s = Math.sin(vWalk) * 0.9;
    vRig.armL.rotation.x = s; vRig.armR.rotation.x = -s;
    vRig.legL.rotation.x = -s; vRig.legR.rotation.x = s;
  }
  if (vMix) vMix.update(dt);

  // --- monster ---
  const pdx = vPos.x - dPos.x;
  const pdz = vPos.z - dPos.z;
  const pd = Math.hypot(pdx, pdz) || 1;

  dVel.x += (pdx / pd) * MON_ACCEL * dt;
  dVel.z += (pdz / pd) * MON_ACCEL * dt;

  const fr = Math.exp(-MON_FRICTION * dt);
  dVel.x *= fr;
  dVel.z *= fr;

  const mspd = dVel.length();
  if (mspd > MON_MAXSPD) {
    const kk = MON_MAXSPD / mspd;
    dVel.x *= kk; dVel.z *= kk;
  }

  dPos.x += dVel.x * dt;
  dPos.z += dVel.z * dt;
  resolve(dPos, 0.6, dVel);

  if (mspd > 0.5) {
    const ta = Math.atan2(dVel.x, dVel.z);
    let dh = (ta - dHeading) % (Math.PI * 2);
    if (dh > Math.PI) dh -= Math.PI * 2;
    if (dh < -Math.PI) dh += Math.PI * 2;
    dHeading += dh * (1 - Math.exp(-MON_TURN * dt));
  }

  drifter.position.copy(dPos);
  drifter.rotation.y = dHeading;

  const fwdX = Math.sin(dHeading), fwdZ = Math.cos(dHeading);
  const lat = dVel.x * fwdZ - dVel.z * fwdX;
  const lean = C(-lat * 0.12, -0.7, 0.7);
  drifterVis.rotation.z += (lean - drifterVis.rotation.z) * Math.min(1, dt * 6);
  drifterVis.rotation.x = C(mspd / MON_MAXSPD, 0, 1) * 0.12;

  dWalk += dt * (mspd * 2.4 + 4);
  if (dRig) {
    const s = Math.sin(dWalk) * 1.1;
    dRig.legL.rotation.x = s; dRig.legR.rotation.x = -s;
    dRig.armL.rotation.x = -s * 0.8; dRig.armR.rotation.x = s * 0.8;
  }
  if (dMix) { dMix.update(dt); dMix.timeScale = 2.2; }

  // --- theme audio: play when chasing, louder when closer ---
  const dist = Math.hypot(pdx, pdz);
  if (themeEl) {
    // "chasing" = within a generous range and monster actually closing in
    const chasing = dist < 38;
    if (chasing) {
      if (themeEl.paused) themeEl.play().catch(() => {});
      // closer -> louder. dist 38 -> ~0.05, dist 1 -> ~1.0
      const t = C(1 - (dist - 1) / 37, 0, 1);
      const targetVol = 0.05 + t * 0.95;
      themeEl.volume += (targetVol - themeEl.volume) * Math.min(1, dt * 6);
    } else {
      // fade out when not chasing
      themeEl.volume += (0 - themeEl.volume) * Math.min(1, dt * 3);
      if (themeEl.volume < 0.01 && !themeEl.paused) themeEl.pause();
    }
  }

  // catch reset
  if (dist < 1.1) {
    vPos.set(0, 0, 0);
    resetMonster();
  }

  // --- camera orbit ---
  const head = new _T.Vector3(vPos.x, vPos.y + 1.65, vPos.z);
  const target = new _T.Vector3(vPos.x, vPos.y + 1.25, vPos.z);

  const dir = new _T.Vector3(
    Math.sin(oYaw) * Math.cos(oPitch),
    -Math.sin(oPitch),
    Math.cos(oYaw) * Math.cos(oPitch)
  ).normalize();

  const d = camLimit(target, dir, oDist);
  const desired = target.clone().addScaledVector(dir, d);
  if (desired.y < 0.22) desired.y = 0.22;

  const near = C((2.4 - oDist) / 1.6, 0, 1);
  const ease = near * near * (3 - 2 * near);

  cam.position.lerpVectors(desired, head, ease);

  const m3 = new _T.Matrix4().lookAt(cam.position, target, new _T.Vector3(0, 1, 0));
  const q3 = new _T.Quaternion().setFromRotationMatrix(m3);
  const e1 = new _T.Euler(oPitch, oYaw, 0, 'YXZ');
  const q1 = new _T.Quaternion().setFromEuler(e1);
  cam.quaternion.copy(q3).slerp(q1, ease);

  viewerVis.visible = ease < 0.5;

  focus.position.set(vPos.x, vPos.y + 1.9, vPos.z);
  key.position.set(vPos.x + 4, 12, vPos.z + 4);
  key.target.position.copy(vPos);
}

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  step(dt);
  R.render(scene, cam);
}

resize();
loop();

// Kick off asset loading; the bar tracks real files now.
loadAllAssets().catch(() => setLoad(100, 'ready'));
</script>
</body>
</html>
