<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LawOS</title>
<style>
  /* Load the classic DOS font */
  @import url('https://fonts.cdnfonts.com/css/perfect-dos-vga-437');

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
  }

  /* Hide screen while the font loads to avoid a text flash */
  #screen {
    padding: 20px;
    font-family: 'Perfect DOS VGA 437', 'Courier New', Courier, monospace;
    font-size: 24px; 
    line-height: 1.2;
    color: #a5a5a5; 
    overflow: hidden;
    
    /* Kill anti-aliasing for that crisp bitmap look */
    -webkit-font-smoothing: none;
    font-smooth: never;
    letter-spacing: 1px;
    visibility: hidden; 
    opacity: 0;
  }

  /* Reveal once the font is ready */
  body.loaded #screen {
    visibility: visible;
    opacity: 1;
  }

  .cursor {
    display: inline-block;
    /* Underscore cursor style */
    width: 0.5em;       
    height: 0.08em;     
    margin-left: 2px;
    background: #a5a5a5;
    animation: blink 1s steps(1) infinite;
    
    /* Keep cursor sharp while the rest is slightly blurred */
    filter: blur(0px);  
    
    vertical-align: baseline;
    position: relative;
    bottom: -0.1em;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <!-- All on one line to stop weird spacing issues -->
  <div id="screen"><span id="history">Welcome to LawOS!<br></span><span>&gt;&gt;&gt; </span><span id="current-input"></span><span class="cursor"></span></div>

  <script>
    // Wait for font to load before showing the terminal
    document.fonts.ready.then(function() {
      document.body.classList.add('loaded');
    });

    const historyEl = document.getElementById('history');
    const inputEl = document.getElementById('current-input');
    
    let currentText = '';

    // Handle keyboard input
    document.addEventListener('keydown', function(e) {
      // Append normal characters (max 32 chars)
      if (e.key.length === 1) {
        if (currentText.length < 32) {
          currentText += e.key;
          inputEl.textContent = currentText;
        }
        e.preventDefault();
      } 
      // Backspace logic
      else if (e.key === 'Backspace') {
        currentText = currentText.slice(0, -1);
        inputEl.textContent = currentText;
        e.preventDefault();
      } 
      // Enter logic
      else if (e.key === 'Enter') {
        if (currentText.length > 0) {
          // Echo the input and add a blank line
          historyEl.innerHTML += `&gt;&gt;&gt; ${currentText}<br>${currentText}<br><br>`;
          
          // Reset the input
          currentText = '';
          inputEl.textContent = '';
        }
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
